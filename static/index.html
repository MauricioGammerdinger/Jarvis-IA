    } catch (err) {
      wrap.innerHTML = '<div class="empty-state">Falha ao carregar: ' + escapeHtml(err.message) + "</div>";
    }
  }

  function renderBrainGraph(notes) {
    if (brainAnimFrame) cancelAnimationFrame(brainAnimFrame);
    const wrap = $("brainGraphWrap");
    const categoriesPresent = new Set(notes.map((n) => n.category));

    $("brainCount").textContent = notes.length || "";
    $("brainSubtitle").textContent = notes.length
      ? `${notes.length} nota${notes.length === 1 ? "" : "s"} · ${categoriesPresent.size} área${categoriesPresent.size === 1 ? "" : "s"}`
      : "";

    renderBrainLegend(categoriesPresent);

    if (!notes.length) {
      wrap.innerHTML = '<div class="empty-state">Nenhuma nota ainda. Peça pro JARVIS "configurar o Second Brain" pra começar.</div>';
      return;
    }

    const W = 900, H = 560, CX = W / 2, CY = H / 2;
    const RX = Math.min(340, 120 + notes.length * 14);
    const RY = Math.min(220, 90 + notes.length * 9);

    // Posiciona cada nota em elipse ao redor do núcleo central
    const positioned = notes.map((note, i) => {
      const angle = (i / notes.length) * Math.PI * 2 - Math.PI / 2;
      return {
        ...note,
        x: CX + Math.cos(angle) * RX,
        y: CY + Math.sin(angle) * RY,
        color: BRAIN_CATEGORIES[note.category]?.color || "#8a90a6",
      };
    });

    let svg = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">`;

    // Arestas (curva Bézier quadrática, ponto de controle puxado em direção ao centro)
    positioned.forEach((n) => {
      const ctrlX = CX + (n.x - CX) * 0.4;
      const ctrlY = CY + (n.y - CY) * 0.4;
      svg += `<path class="brain-edge" d="M ${CX} ${CY} Q ${ctrlX} ${ctrlY} ${n.x} ${n.y}" stroke="${n.color}" />`;
    });

    // Núcleo central
    svg += `<circle class="brain-core-ring" cx="${CX}" cy="${CY}" r="34" />`;
    svg += `<circle cx="${CX}" cy="${CY}" r="22" fill="#5fe3f0" opacity="0.85" />`;
    svg += `<text x="${CX}" y="${CY + 5}" text-anchor="middle" font-size="18">🧠</text>`;

    // Nós (uma nota cada)
    positioned.forEach((n, i) => {
      const r = 16 + Math.min(8, notes.length > 8 ? 0 : 2);
      svg += `<circle class="brain-node-ring" cx="${n.x}" cy="${n.y}" r="${r + 5}" stroke="${n.color}" />`;
      svg += `<circle class="brain-node-circle" data-id="${n.id}" cx="${n.x}" cy="${n.y}" r="${r}" fill="${n.color}" />`;
      const title = (n.content.length > 18 ? n.content.slice(0, 18) + "…" : n.content);
      svg += `<text class="brain-node-label" x="${n.x}" y="${n.y + r + 14}">${escapeHtml(title)}</text>`;
    });

    svg += "</svg>";

    // Compatibilidade: injeta a STRING inteira numa div contêiner, nunca
    // via innerHTML direto num elemento <svg> (evita bug de namespace).
    wrap.innerHTML = svg;

    wrap.querySelectorAll(".brain-node-circle").forEach((el) => {
      el.addEventListener("click", () => openBrainEditor(notes.find((n) => String(n.id) === el.dataset.id)));
    });

    startBrainPulses(positioned, CX, CY);
  }

  function renderBrainLegend(categoriesPresent) {
    const legend = $("brainLegend");
    legend.innerHTML = "";
    categoriesPresent.forEach((cat) => {
      const info = BRAIN_CATEGORIES[cat];
      if (!info) return;
      const item = document.createElement("div");
      item.className = "brain-legend-item";
      item.innerHTML = `<span class="brain-legend-dot" style="background:${info.color}"></span>${escapeHtml(info.label)}`;
      legend.appendChild(item);
    });
  }

  function startBrainPulses(positioned, CX, CY) {
    const svgEl = document.querySelector("#brainGraphWrap svg");
    if (!svgEl || !positioned.length) return;

    brainPulses = Array.from({ length: Math.min(10, positioned.length * 2) }, () => ({
      target: positioned[Math.floor(Math.random() * positioned.length)],
      t: Math.random(),
      speed: 0.004 + Math.random() * 0.004,
    }));

    brainPulses.forEach((p) => {
      const dot = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      dot.setAttribute("r", "3");
      dot.setAttribute("class", "brain-pulse");
      svgEl.appendChild(dot);
      p.el = dot;
    });

    function tick() {
      brainPulses.forEach((p) => {
        p.t += p.speed;
        if (p.t > 1) {
          p.t = 0;
          p.target = positioned[Math.floor(Math.random() * positioned.length)];
        }
        const ctrlX = CX + (p.target.x - CX) * 0.4;
        const ctrlY = CY + (p.target.y - CY) * 0.4;
        const t = p.t;
        const x = (1 - t) ** 2 * CX + 2 * (1 - t) * t * ctrlX + t ** 2 * p.target.x;
        const y = (1 - t) ** 2 * CY + 2 * (1 - t) * t * ctrlY + t ** 2 * p.target.y;
        p.el.setAttribute("cx", x);
        p.el.setAttribute("cy", y);
        p.el.setAttribute("opacity", Math.sin(t * Math.PI));
      });
      brainAnimFrame = requestAnimationFrame(tick);
    }
    tick();
  }

  function openBrainEditor(note) {
    if (!note) return;
    const overlay = document.createElement("div");
    overlay.className = "brain-editor";
    overlay.innerHTML = `
      <div class="brain-editor-box">
        <strong>${escapeHtml(BRAIN_CATEGORIES[note.category]?.label || note.category)}</strong>
        <textarea id="brainEditContent">${escapeHtml(note.content)}</textarea>
        <div class="row">
          <button id="brainDeleteBtn" style="background:#3b1d1d;color:var(--red)">Excluir</button>
          <button id="brainCloseBtn" style="background:var(--panel-2);color:var(--text-dim)">Fechar</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    overlay.addEventListener("click", (e) => { if (e.target === overlay) overlay.remove(); });
    overlay.querySelector("#brainCloseBtn").addEventListener("click", () => overlay.remove());
    overlay.querySelector("#brainDeleteBtn").addEventListener("click", async () => {
      try {
        await fetch(`${serverUrl}/memories/${note.id}`, { method: "DELETE", headers: { "X-API-Key": apiKey } });
        overlay.remove();
        loadSecondBrain();
      } catch (err) {
        alert("Falha ao excluir: " + err.message);
      }
    });
  }

  async function init() {
    sessionTitle.textContent = "Conversa atual";
    if (apiKey) {
      await loadSessions();
      await switchSession(currentSessionId);
      loadCommands();
    } else {
      addLine("assistant", "Sistemas prontos, senhor. Configure a conexão se ainda não fez.");
    }
  }
  init();
})();
</script>

<script id="face-mode-layer">
/*
 * TELA FACE — componente novo e autossuficiente, adicionado por último.
 * Não depende de nada específico do app: usa `try`/`typeof` em tudo que
 * é opcional, e degrada com elegância (mostra "—") se não existir.
 */
(function () {
  const FACE_HTML = `
    <canvas id="faceGlobe"></canvas>
    <div class="face-scanlines"></div>
    <div class="face-corners">
      <span class="corner tl"></span><span class="corner tr"></span>
      <span class="corner bl"></span><span class="corner br"></span>
    </div>
    <div class="face-top">
      <div class="face-brand">JARVIS</div>
      <div class="face-clock">
        <div id="faceTime">00:00:00</div>
        <div id="faceDate">—</div>
      </div>
    </div>
    <div class="face-orb-wrap">
      <div class="face-ring r1"></div>
      <div class="face-ring r2"></div>
      <div class="face-ring r3"></div>
      <div class="face-core" id="faceOrb" title="Clique pra ouvir"></div>
    </div>
    <div class="face-state" id="faceStateLabel">ONLINE</div>
    <div class="face-transcript" id="faceTranscript"></div>
    <div class="face-panel face-panel-left">
      <div class="face-panel-title">Vitals</div>
      <div id="faceVitals"></div>
      <div class="face-panel-title">Status</div>
      <div id="faceStatus"></div>
    </div>
    <div class="face-panel face-panel-right">
      <div class="face-panel-title">Logs</div>
      <div id="faceLogs"></div>
      <div class="face-panel-title">Feeds</div>
      <div id="faceFeeds"></div>
    </div>
    <div class="face-ticker" id="faceTicker">SISTEMAS NOMINAIS —</div>
    <div class="face-hint">F sai · Esc fecha</div>
  `;

  const faceMode = document.createElement("div");
  faceMode.id = "faceMode";
  faceMode.dataset.s = "idle";
  faceMode.innerHTML = FACE_HTML;
  // GOTCHA: reparenta pro <body> na hora — se nascesse dentro de uma aba
  // com display:none, sairia da árvore visível e nunca apareceria.
  document.body.appendChild(faceMode);

  let faceOn = false;
  let clockInterval = null;
  let vitalsInterval = null;
  let feedsInterval = null;
  let globeAnimFrame = null;
  let globePoints = [];
  let globeAngle = 0;

  // ── Relógio (pt-BR) ────────────────────────────────────────────────
  function tickClock() {
    const now = new Date();
    const time = now.toLocaleTimeString("pt-BR", { hour12: false });
    const date = now.toLocaleDateString("pt-BR", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
    const timeEl = document.getElementById("faceTime");
    const dateEl = document.getElementById("faceDate");
    if (timeEl) timeEl.textContent = time;
    if (dateEl) dateEl.textContent = date;
  }

  // ── Globo em canvas — esfera de Fibonacci, ~800 pontos ──────────────
  function buildGlobePoints(n) {
    const points = [];
    const goldenAngle = Math.PI * (3 - Math.sqrt(5));
    for (let i = 0; i < n; i++) {
      const y = 1 - (i / (n - 1)) * 2;
      const radiusAtY = Math.sqrt(1 - y * y);
      const theta = goldenAngle * i;
      points.push({ x: Math.cos(theta) * radiusAtY, y, z: Math.sin(theta) * radiusAtY });
    }
    return points;
  }

  function drawGlobe() {
    const canvas = document.getElementById("faceGlobe");
    if (!canvas || !faceOn) return;
    const ctx = canvas.getContext("2d");
    const w = (canvas.width = canvas.clientWidth);
    const h = (canvas.height = canvas.clientHeight);
    ctx.clearRect(0, 0, w, h);

    const cx = w / 2, cy = h / 2;
    const radius = Math.min(w, h) * 0.32;

    // Reage a amplitude de áudio real se existir; senão, pulsa suave sozinho (demo)
    let amplitude = 0.5 + Math.sin(Date.now() / 900) * 0.15; // demo
    try {
      if (typeof window._jarvisAudioLevel === "function") amplitude = window._jarvisAudioLevel();
      else if (typeof window._micLevel === "number") amplitude = window._micLevel;
    } catch (e) { /* mantém o valor demo se der erro */ }

    globeAngle += 0.0022;
    const cos = Math.cos(globeAngle), sin = Math.sin(globeAngle);

    globePoints.forEach((p) => {
      const x = p.x * cos - p.z * sin;
      const z = p.x * sin + p.z * cos;
      const scale = radius * (1 + amplitude * 0.08);
      const px = cx + x * scale;
      const py = cy + p.y * scale;
      const depth = (z + 1) / 2;
      ctx.beginPath();
      ctx.arc(px, py, 0.6 + depth * 1.3, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(95, 227, 240, ${0.15 + depth * 0.5})`;
      ctx.fill();
    });

    globeAnimFrame = requestAnimationFrame(drawGlobe);
  }

  // ── Painéis HUD — degradam pra "—" quando o dado não existe ─────────
  function safeCall(fn, fallback) {
    try {
      const v = typeof fn === "function" ? fn() : fn;
      return v === undefined || v === null ? fallback : v;
    } catch (e) {
      return fallback;
    }
  }

  function updateVitals() {
    if (!faceOn) return;
    const el = document.getElementById("faceVitals");
    if (!el) return;

    let heap = "—";
    try {
      if (performance.memory) heap = (performance.memory.usedJSHeapSize / 1048576).toFixed(0) + " MB";
    } catch (e) { /* só existe em navegadores Chromium */ }

    const emails = safeCall(() => window.DATA && window.DATA.emails, "—");
    const tasks = safeCall(() => window.tasks, "—");
    const calendar = safeCall(() => window.DATA && window.DATA.calendar, "—");

    el.innerHTML = `
      <div class="face-row"><span>Heap</span><span>${heap}</span></div>
      <div class="face-row"><span>E-mails</span><span>${emails}</span></div>
      <div class="face-row"><span>Tarefas</span><span>${tasks}</span></div>
      <div class="face-row"><span>Agenda</span><span>${calendar}</span></div>
    `;
  }

  function updateStatus() {
    if (!faceOn) return;
    const el = document.getElementById("faceStatus");
    if (!el) return;

    const serverOk = true; // se chegou até aqui, a página carregou; refinar se houver healthcheck
    const rows = [
      { label: "Servidor", ok: serverOk },
      { label: "Voz", ok: safeCall(() => typeof window.toggleListening === "function", false) },
    ];
    el.innerHTML = rows
      .map((r) => `<div class="face-row"><span><span class="dot" style="background:${r.ok ? "var(--dl-green,#6fe0a0)" : "var(--txt3)"}"></span>${r.label}</span><span>${r.ok ? "OK" : "STANDBY"}</span></div>`)
      .join("");
  }

  function pushLog(text) {
    const el = document.getElementById("faceLogs");
    if (!el) return;
    const line = document.createElement("div");
    line.className = "face-log-line";
    const time = new Date().toLocaleTimeString("pt-BR", { hour12: false });
    line.textContent = `[${time}] ${text}`;
    el.insertBefore(line, el.firstChild);
    while (el.children.length > 6) el.removeChild(el.lastChild);
  }

  function updateFeeds() {
    if (!faceOn) return;
    const el = document.getElementById("faceFeeds");
    if (!el) return;
    const news = safeCall(() => window.DATA && window.DATA.news_headlines, null);
    if (Array.isArray(news) && news.length) {
      el.innerHTML = news.slice(0, 4).map((n) => `<div class="face-log-line">• ${n}</div>`).join("");
    } else {
      el.innerHTML = `<div class="face-log-line">aguardando sync...</div>`;
    }
  }

  // ── Estado (idle/listening/thinking/speaking) ───────────────────────
  const STATE_LABELS = { idle: "ONLINE", listening: "OUVINDO", thinking: "PROCESSANDO", speaking: "FALANDO" };

  function setFaceState(state) {
    faceMode.dataset.s = state;
    const label = document.getElementById("faceStateLabel");
    if (label) label.textContent = STATE_LABELS[state] || state.toUpperCase();
  }

  try {
    if (Array.isArray(window._orbSetters)) {
      window._orbSetters.push(setFaceState);
    } else if (window._orbSetters === undefined) {
      window._orbSetters = [setFaceState];
    }
  } catch (e) { /* segue sem integrar, não é crítico */ }

  // ── Transcript — espelha window._setTranscript / _jarvisFeedPush se existirem ──
  function updateTranscriptDisplay(text) {
    const el = document.getElementById("faceTranscript");
    if (el && text) el.textContent = text;
  }
  try {
    if (typeof window._setTranscript === "function") {
      const original = window._setTranscript;
      window._setTranscript = function (...args) {
        const result = original.apply(this, args);
        updateTranscriptDisplay(args[0]);
        return result;
      };
    }
  } catch (e) { /* opcional */ }
  try {
    if (typeof window._jarvisFeedPush === "function") {
      const original2 = window._jarvisFeedPush;
      window._jarvisFeedPush = function (...args) {
        const result = original2.apply(this, args);
        if (args[0]) { updateTranscriptDisplay(args[0]); pushLog(String(args[0]).slice(0, 60)); }
        return result;
      };
    }
  } catch (e) { /* opcional */ }

  // ── Clique no orbe: chama toggleListening() se existir ──────────────
  const orbEl = document.getElementById("faceOrb");
  if (orbEl) {
    orbEl.addEventListener("click", () => {
      try {
        if (typeof window.toggleListening === "function") window.toggleListening();
      } catch (e) { /* no-op se não existir */ }
    });
  }

  // ── Ativação / desativação ───────────────────────────────────────────
  window.faceModeToggle = function (on) {
    faceOn = on !== undefined ? on : !faceMode.classList.contains("on");
    faceMode.classList.toggle("on", faceOn);

    if (faceOn) {
      if (!globePoints.length) globePoints = buildGlobePoints(800);
      tickClock();
      updateVitals();
      updateStatus();
      updateFeeds();
      pushLog("Núcleo sincronizado.");
      pushLog("Varredura ok.");
      clockInterval = setInterval(tickClock, 1000);
      vitalsInterval = setInterval(updateVitals, 1000);
      feedsInterval = setInterval(() => { updateStatus(); updateFeeds(); }, 15000);
      drawGlobe();
    } else {
      clearInterval(clockInterval);
      clearInterval(vitalsInterval);
      clearInterval(feedsInterval);
      if (globeAnimFrame) cancelAnimationFrame(globeAnimFrame);
    }
  };

  const faceBtn = document.getElementById("faceModeBtn");
  if (faceBtn) faceBtn.addEventListener("click", () => window.faceModeToggle());

  document.addEventListener("keydown", (e) => {
    const tag = (e.target && e.target.tagName) || "";
    if (tag === "INPUT" || tag === "TEXTAREA") return; // não intercepta enquanto digitando
    if (e.key === "f" || e.key === "F") window.faceModeToggle();
    if (e.key === "Escape" && faceMode.classList.contains("on")) window.faceModeToggle(false);
  });

  // Suporte a ?face=1 na URL — útil pra "modo show" numa segunda tela
  try {
    const params = new URLSearchParams(window.location.search);
    if (params.get("face") === "1") window.faceModeToggle(true);
  } catch (e) { /* opcional */ }
})();
</script>
