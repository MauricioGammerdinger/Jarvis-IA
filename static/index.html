<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>J.A.R.V.I.S.</title>

<link rel="manifest" href="/app/manifest.json" />
<meta name="theme-color" content="#090c11" />
<link rel="icon" href="/app/icon-192.png" />
<link rel="apple-touch-icon" href="/app/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="JARVIS" />
<meta name="mobile-web-app-capable" content="yes" />

<style>
  :root {
    --bg: #090c11;
    --panel: #10161f;
    --panel-2: #151d29;
    --sidebar: #0c1017;
    --line: #202a38;
    --cyan: #5fe3f0;
    --cyan-dim: #2d4a52;
    --amber: #f2a93b;
    --red: #e0665f;
    --green: #6fe0a0;
    --text: #e6edf3;
    --text-dim: #7c8ba0;
    --sidebar-width: 264px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    background: var(--bg); color: var(--text);
  }
  button { font-family: inherit; }

  .app-shell { display: flex; height: 100vh; overflow: hidden; }

  .sidebar {
    width: var(--sidebar-width); flex-shrink: 0;
    background: var(--sidebar); border-right: 1px solid var(--line);
    display: flex; flex-direction: column;
    transition: margin-left .25s ease;
  }
  .sidebar-header { display: flex; align-items: center; gap: 10px; padding: 16px 14px 12px; }
  .core { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--cyan); position: relative; flex-shrink: 0; transition: box-shadow .3s; }
  .core::before { content: ''; position: absolute; inset: 4px; border-radius: 50%; background: var(--cyan); opacity: .7; }
  .core.thinking { animation: corePulse 1.1s ease-in-out infinite; }
  @keyframes corePulse { 0%,100% { box-shadow: 0 0 4px rgba(95,227,240,.3); transform: scale(1); } 50% { box-shadow: 0 0 16px rgba(95,227,240,.8); transform: scale(1.12); } }
  .brand-name { font-weight: 700; font-size: 14px; letter-spacing: .5px; }

  .new-chat-btn {
    margin: 4px 14px 14px; padding: 10px 12px;
    background: var(--cyan-dim); color: var(--cyan); border: 1px solid var(--cyan);
    border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer;
    display: flex; align-items: center; gap: 8px; transition: background .2s, transform .1s;
  }
  .new-chat-btn:hover { background: var(--cyan); color: #061014; }
  .new-chat-btn:active { transform: scale(.97); }

  .sidebar-label { padding: 4px 18px; font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: .6px; }

  .session-list { flex: 1; overflow-y: auto; padding: 2px 8px; display: flex; flex-direction: column; gap: 2px; }
  .session-list::-webkit-scrollbar { width: 5px; }
  .session-list::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }
  .session-item {
    padding: 9px 10px; border-radius: 8px; font-size: 13px; color: var(--text-dim);
    cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    transition: background .15s, color .15s;
  }
  .session-item:hover { background: var(--panel-2); color: var(--text); }
  .session-item.active { background: var(--panel-2); color: var(--cyan); }

  .sidebar-footer { border-top: 1px solid var(--line); padding: 8px; display: flex; flex-direction: column; gap: 2px; }
  .sidebar-nav-item {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 9px 10px; border-radius: 8px; background: none; border: none;
    color: var(--text-dim); font-size: 12.5px; cursor: pointer; text-align: left; width: 100%;
    transition: background .15s, color .15s;
  }
  .sidebar-nav-item:hover { background: var(--panel-2); color: var(--text); }
  .sidebar-nav-item.active-toggle { color: var(--cyan); }
  .badge { background: var(--amber); color: #241a06; font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 10px; min-width: 16px; text-align: center; }
  .badge:empty { display: none; }

  .main-area { flex: 1; display: flex; flex-direction: column; min-width: 0; background: var(--bg); }
  .topbar {
    display: flex; align-items: center; gap: 10px; padding: 12px 20px;
    border-bottom: 1px solid var(--line); font-size: 12.5px; color: var(--text-dim);
    flex-shrink: 0;
  }
  #sidebarToggle { display: none; background: none; border: none; color: var(--text); font-size: 18px; cursor: pointer; padding: 2px 4px; }
  #sessionTitle { font-weight: 600; color: var(--text); font-size: 13px; }
  #statusline { margin-left: auto; }

  .panel { display: none; flex: 1; min-height: 0; flex-direction: column; }
  .panel.active { display: flex; }

  .chat-scroll { flex: 1; overflow-y: auto; }
  .chat-scroll::-webkit-scrollbar { width: 7px; }
  .chat-scroll::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }
  .chat-inner { max-width: 720px; margin: 0 auto; padding: 24px 24px 8px; display: flex; flex-direction: column; gap: 22px; }

  @keyframes fadeInUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

  .msg { font-size: 15px; line-height: 1.65; animation: fadeInUp .25s ease both; }
  .msg.user { align-self: flex-end; max-width: 80%; background: var(--panel-2); padding: 10px 15px; border-radius: 14px 14px 3px 14px; }
  .msg.assistant { max-width: 100%; }
  .msg.assistant .msg-label { display: flex; align-items: center; gap: 7px; color: var(--cyan); font-weight: 700; font-size: 12.5px; letter-spacing: .3px; margin-bottom: 6px; }
  .msg.assistant .msg-label .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--cyan); }
  .msg.system { align-self: center; color: var(--text-dim); font-size: 11.5px; font-style: italic; }
  .msg.tool { display: flex; align-items: center; gap: 8px; color: var(--amber); font-size: 12.5px; opacity: .9; }
  .msg.tool .tool-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--amber); flex-shrink: 0; animation: toolPulse 1.2s ease-in-out infinite; }
  @keyframes toolPulse { 0%,100% { opacity: .4; } 50% { opacity: 1; } }

  .msg.screenshot { align-self: flex-start; max-width: 380px; }
  .msg.screenshot img {
    width: 100%; display: block; border-radius: 10px; border: 1px solid var(--line);
    cursor: zoom-in; transition: border-color .2s;
  }
  .msg.screenshot img:hover { border-color: var(--cyan); }

  .msg-body p { margin: 0 0 10px; }
  .msg-body p:last-child { margin-bottom: 0; }
  .msg-body strong { color: #fff; font-weight: 700; }
  .msg-body em { color: var(--text); }
  .msg-body ul, .msg-body ol { margin: 4px 0 10px; padding-left: 22px; }
  .msg-body li { margin-bottom: 4px; }
  .msg-body a { color: var(--cyan); text-decoration: underline; text-underline-offset: 2px; }
  .msg-body code { background: var(--panel-2); border: 1px solid var(--line); padding: 1px 6px; border-radius: 5px; font-size: 13px; font-family: "SF Mono", "JetBrains Mono", Consolas, monospace; }
  .msg-body pre { background: #0c1119; border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; overflow-x: auto; margin: 8px 0 12px; }
  .msg-body pre code { background: none; border: none; padding: 0; font-size: 13px; line-height: 1.5; color: #d3e6ec; }

  .typing { align-self: flex-start; display: flex; gap: 4px; padding: 4px 0; }
  .typing span { width: 6px; height: 6px; border-radius: 50%; background: var(--cyan); opacity: .4; animation: typingBounce 1.1s ease-in-out infinite; }
  .typing span:nth-child(2) { animation-delay: .15s; }
  .typing span:nth-child(3) { animation-delay: .3s; }
  @keyframes typingBounce { 0%,60%,100% { opacity: .3; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-4px); } }

  .composer-wrap { max-width: 720px; margin: 0 auto; width: 100%; padding: 10px 24px 20px; flex-shrink: 0; }
  .attach-preview { display: none; align-items: center; gap: 8px; font-size: 11.5px; color: var(--text-dim); padding: 0 4px 8px; }
  .attach-preview.show { display: flex; animation: fadeInUp .2s ease both; }
  .attach-preview button { background: none; border: none; color: var(--red); cursor: pointer; font-size: 13px; }

  .composer {
    display: flex; align-items: flex-end; gap: 6px;
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 18px;
    padding: 8px 8px 8px 14px; transition: border-color .2s;
  }
  .composer:focus-within { border-color: var(--cyan); }
  .icon-btn { background: none; border: none; color: var(--text-dim); font-size: 19px; cursor: pointer; padding: 6px; border-radius: 8px; flex-shrink: 0; transition: color .15s, transform .1s; }
  .icon-btn:hover { color: var(--text); }
  .icon-btn:active { transform: scale(.9); }
  .icon-btn.recording { color: var(--red); animation: micPulse 1s ease-in-out infinite; }
  @keyframes micPulse { 0%,100% { opacity: 1; } 50% { opacity: .4; } }

  #input {
    flex: 1; background: none; border: none; color: var(--text); font-size: 15px;
    resize: none; outline: none; font-family: inherit; line-height: 1.5;
    padding: 7px 2px; max-height: 160px;
  }
  #input::placeholder { color: var(--text-dim); }

  #send {
    background: var(--cyan); color: #061014; border: none; border-radius: 12px;
    width: 34px; height: 34px; flex-shrink: 0; cursor: pointer; font-size: 15px;
    display: flex; align-items: center; justify-content: center;
    transition: opacity .2s, transform .1s;
  }
  #send:disabled { opacity: .35; cursor: not-allowed; }
  #send:not(:disabled):active { transform: scale(.92); }

  #stopBtn {
    background: var(--red); color: #250a08; border: none; border-radius: 12px;
    width: 34px; height: 34px; flex-shrink: 0; cursor: pointer; font-size: 13px;
    display: flex; align-items: center; justify-content: center;
    transition: transform .1s;
  }
  #stopBtn:active { transform: scale(.92); }

  .settings-inner { max-width: 480px; margin: 40px auto; padding: 0 24px; display: flex; flex-direction: column; gap: 14px; }
  .settings-inner h2 { font-size: 18px; margin: 0 0 4px; }
  .settings-inner label { font-size: 12.5px; color: var(--text-dim); }
  .settings-inner input {
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px;
    color: var(--text); padding: 11px 13px; font-size: 14px; outline: none; transition: border-color .2s;
  }
  .settings-inner input:focus { border-color: var(--cyan); }
  .settings-inner select {
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px;
    color: var(--text); padding: 11px 13px; font-size: 14px; outline: none; transition: border-color .2s;
  }
  .settings-inner select:focus { border-color: var(--cyan); }

  .apps-list { display: flex; flex-direction: column; gap: 6px; max-height: 200px; overflow-y: auto; }
  .apps-list-item {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px;
    padding: 8px 12px; font-size: 13px;
  }
  .apps-list-item .app-info { overflow: hidden; }
  .apps-list-item .app-name { font-weight: 600; }
  .apps-list-item .app-cmd { color: var(--text-dim); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .apps-list-item button { background: none; border: none; color: var(--red); cursor: pointer; font-size: 16px; flex-shrink: 0; padding: 2px 6px; }
  .apps-form { display: flex; gap: 6px; margin-top: 4px; }
  .apps-form input {
    flex: 1; background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px;
    color: var(--text); padding: 9px 10px; font-size: 13px; outline: none;
  }
  .apps-form input:focus { border-color: var(--cyan); }
  .apps-form button {
    background: var(--cyan-dim); color: var(--cyan); border: 1px solid var(--cyan);
    border-radius: 8px; padding: 0 14px; font-size: 12.5px; font-weight: 700; cursor: pointer; white-space: nowrap;
  }
  .apps-form button:hover { background: var(--cyan); color: #061014; }
  .settings-inner button {
    background: var(--cyan-dim); color: var(--cyan); border: 1px solid var(--cyan);
    border-radius: 10px; padding: 11px; font-weight: 700; font-size: 13.5px; cursor: pointer;
    transition: background .2s;
  }
  .settings-inner button:hover { background: var(--cyan); color: #061014; }

  .commands-inner { max-width: 640px; margin: 0 auto; padding: 24px; width: 100%; overflow-y: auto; }
  .cmditem { background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; font-size: 13px; animation: fadeInUp .25s ease both; }
  .cmditem code { display: block; background: var(--bg); padding: 8px 10px; border-radius: 8px; margin: 8px 0; font-size: 12px; word-break: break-all; }
  .cmditem .row { display: flex; gap: 8px; margin-top: 10px; }
  .cmditem button { flex: 1; border: none; border-radius: 8px; padding: 9px; font-weight: 700; font-size: 12px; cursor: pointer; transition: transform .1s; }
  .cmditem button:active { transform: scale(.96); }
  .approve { background: #1d3b2e; color: var(--green); }
  .reject { background: #3b1d1d; color: var(--red); }
  .empty-state { color: var(--text-dim); font-size: 13px; font-style: italic; text-align: center; padding: 40px 0; }

  /* ── Second Brain — grafo neural animado ─────────────────────────── */
  .brain-toolbar { display: flex; align-items: center; justify-content: space-between; padding: 16px 24px 8px; flex-shrink: 0; }
  .brain-subtitle { color: var(--text-dim); font-size: 12px; margin-left: 10px; }
  .brain-graph-wrap { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .brain-graph-wrap svg { width: 100%; height: 100%; max-width: 900px; }

  .brain-node-circle { cursor: pointer; transition: r .15s; }
  .brain-node-circle:hover { filter: brightness(1.3); }
  .brain-node-ring { fill: none; stroke-width: 1.5; opacity: .5; animation: brainBreathe 3s ease-in-out infinite; }
  @keyframes brainBreathe { 0%,100% { opacity: .15; transform: scale(1); } 50% { opacity: .55; transform: scale(1.15); } }
  .brain-node-label { fill: var(--text); font-size: 11px; text-anchor: middle; pointer-events: none; font-family: inherit; }
  .brain-edge { fill: none; stroke-width: 1.4; opacity: .55; }
  .brain-core-ring { fill: none; stroke: var(--cyan); opacity: .3; animation: brainBreathe 2.4s ease-in-out infinite; }
  .brain-pulse { fill: #fff; filter: drop-shadow(0 0 3px #fff); }

  .brain-legend { display: flex; flex-wrap: wrap; gap: 14px; padding: 10px 24px 18px; justify-content: center; flex-shrink: 0; }
  .brain-legend-item { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--text-dim); }
  .brain-legend-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }

  .help-inner { max-width: 680px; margin: 0 auto; padding: 24px; width: 100%; overflow-y: auto; }
  .help-category { margin-bottom: 26px; }
  .help-category h3 {
    font-size: 13px; color: var(--cyan); text-transform: uppercase; letter-spacing: .5px;
    margin: 0 0 10px; display: flex; align-items: center; gap: 8px;
  }
  .help-item {
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 14px; margin-bottom: 6px; font-size: 13.5px; display: flex;
    align-items: baseline; gap: 8px; cursor: pointer; transition: border-color .15s;
  }
  .help-item:hover { border-color: var(--cyan); }
  .help-item .help-phrase { color: var(--text); font-style: italic; flex-shrink: 0; }
  .help-item .help-desc { color: var(--text-dim); font-size: 12px; }

  /* ── Central de Agenda / E-mails / Notícias ──────────────────────── */
  .hub-toolbar { display: flex; align-items: center; justify-content: space-between; padding: 16px 24px 8px; flex-shrink: 0; }
  .hub-tabs { display: flex; gap: 6px; padding: 0 24px 12px; flex-shrink: 0; }
  .hub-tab {
    background: var(--panel-2); border: 1px solid var(--line); color: var(--text-dim);
    border-radius: 8px; padding: 6px 14px; font-size: 12.5px; font-weight: 600; cursor: pointer;
  }
  .hub-tab.active { background: var(--cyan-dim); color: var(--cyan); border-color: var(--cyan); }
  .hub-inner { max-width: 720px; margin: 0 auto; padding: 8px 24px 24px; width: 100%; overflow-y: auto; flex: 1; }

  .hub-card {
    border-radius: 10px; background: var(--panel-2); border: 1px solid var(--line);
    padding: 12px 16px; margin-bottom: 8px; font-size: 13px;
  }
  .hub-card-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .hub-card-title { font-weight: 600; color: var(--text); }
  .hub-card-meta { color: var(--text-dim); font-size: 11.5px; white-space: nowrap; }
  .hub-card-sub { color: var(--text-dim); font-size: 12px; margin-top: 4px; }
  .hub-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 8px; }
  .hub-day-label { color: var(--text-dim); font-size: 11px; text-transform: uppercase; letter-spacing: 1px; margin: 16px 0 8px; }
  .hub-day-label:first-child { margin-top: 0; }
  .hub-error-card { border-color: var(--red); color: var(--red); font-size: 12.5px; }

  .brain-editor {
    position: fixed; inset: 0; background: rgba(4,6,10,.7); display: flex;
    align-items: center; justify-content: center; z-index: 30; padding: 20px;
  }
  .brain-editor-box {
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 14px;
    padding: 20px; max-width: 420px; width: 100%; display: flex; flex-direction: column; gap: 10px;
  }
  .brain-editor-box textarea {
    background: var(--bg); border: 1px solid var(--line); border-radius: 8px; color: var(--text);
    padding: 10px; font-size: 13px; font-family: inherit; resize: vertical; min-height: 70px;
  }
  .brain-editor-box .row { display: flex; gap: 8px; }
  .brain-editor-box button { flex: 1; border: none; border-radius: 8px; padding: 10px; font-weight: 700; font-size: 12.5px; cursor: pointer; }


  @media (max-width: 780px) {
    .sidebar { position: fixed; top: 0; bottom: 0; left: 0; z-index: 20; margin-left: calc(-1 * var(--sidebar-width)); box-shadow: 20px 0 40px rgba(0,0,0,.4); }
    .sidebar.open { margin-left: 0; }
    #sidebarToggle { display: block; }
    .chat-inner, .composer-wrap, .settings-inner, .commands-inner { padding-left: 16px; padding-right: 16px; }
    .msg.user { max-width: 92%; }
  }

  @media (prefers-reduced-motion: reduce) {
    .core.thinking, .typing span, .icon-btn.recording, .msg.tool .tool-dot { animation: none; }
    .msg, .attach-preview.show, .cmditem { animation: none; }
  }
</style>

<style id="design-layer">
  /* ═══════════════════════════════════════════════════════════════════
     DESIGN LAYER — J.A.R.V.I.S. — Sci-fi / Cockpit HUD
     Camada de estilo isolada, aplicada por último. Não altera HTML
     estrutural, IDs, classes usadas por JS, nem lógica — só visual.
     Tokens em :root: trocar a paleta é trocar as variáveis abaixo.
     ═══════════════════════════════════════════════════════════════════ */

  :root {
    /* Cores base — ciano + violeta, tema herdado refinado com profundidade */
    --bg: #050709;
    --surface: #0a0e14;
    --card: #10161f;
    --card-glass: rgba(16, 22, 31, 0.62);
    --border: rgba(148, 178, 194, 0.14);
    --border-strong: rgba(95, 227, 240, 0.4);
    --primary: #5fe3f0;
    --primary-dim: #2d4a52;
    --accent: #8b7cff;
    --txt: #e9eff4;
    --txt2: #93a4b8;
    --txt3: #5b6b80;
    --dl-green: #6fe0a0;
    --dl-red: #e0665f;
    --dl-yellow: #f2a93b;
    --brand-gradient: linear-gradient(120deg, var(--primary), var(--accent));

    /* Escala de espaçamento */
    --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px;
    --sp-6: 24px; --sp-8: 32px; --sp-13: 52px;

    --dl-radius: 12px;
    --dl-ease: cubic-bezier(.22, 1, .36, 1);
    --dl-dur: .22s;

    --font-display: 'Space Grotesk', -apple-system, sans-serif;
    --font-body: 'Inter', -apple-system, sans-serif;
  }

  /* ── Fundo com profundidade: nunca preto chapado ──────────────────── */
  body {
    font-family: var(--font-body);
    background: var(--bg);
    position: relative;
  }
  body::before {
    content: '';
    position: fixed;
    inset: -20%;
    z-index: 0;
    pointer-events: none;
    background:
      radial-gradient(ellipse 900px 600px at 15% -10%, rgba(95, 227, 240, 0.14), transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 30%, rgba(139, 124, 255, 0.12), transparent 60%),
      radial-gradient(ellipse 800px 700px at 30% 120%, rgba(95, 227, 240, 0.09), transparent 60%);
  }
  body::after {
    /* Aurora animada, bem lenta — dá vida ao fundo sem chamar atenção */
    content: '';
    position: fixed;
    inset: -30%;
    z-index: 0;
    pointer-events: none;
    opacity: .5;
    background: conic-gradient(from 0deg at 50% 50%,
      rgba(95,227,240,.10), rgba(139,124,255,.10), transparent 35%, transparent 65%, rgba(95,227,240,.10));
    animation: dl-aurora-spin 26s linear infinite;
    mix-blend-mode: screen;
  }
  @keyframes dl-aurora-spin { to { transform: rotate(360deg); } }
  .app-shell::after {
    /* Micro dot-grid, quase imperceptível — textura, não decoração */
    content: '';
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    opacity: .05;
    background-image: radial-gradient(circle, var(--txt2) 1px, transparent 1px);
    background-size: 28px 28px;
  }
  .app-shell { position: relative; z-index: 1; }

  /* ── Tipografia ────────────────────────────────────────────────────── */
  .brand-name { font-family: var(--font-display); font-weight: 700; letter-spacing: 1px; }
  .sidebar-label, .brain-legend-item, .help-category h3 { font-family: var(--font-body); font-weight: 600; letter-spacing: .7px; }
  .msg.assistant .msg-label { font-family: var(--font-display); font-weight: 700; letter-spacing: .6px; }
  h2 { font-family: var(--font-display); font-weight: 600; }
  ::selection { background: var(--primary); color: #04141a; }

  /* ── Scrollbar fina, consistente em todo lugar ────────────────────── */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-thumb { background: rgba(148, 178, 194, .25); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(95, 227, 240, .4); }

  /* ── Sidebar: vidro com profundidade real ─────────────────────────── */
  .sidebar {
    background: linear-gradient(180deg, rgba(10, 14, 20, .9), rgba(6, 8, 12, .96));
    backdrop-filter: blur(20px);
    border-right: 1px solid var(--border);
    box-shadow: 8px 0 30px rgba(0, 0, 0, .35);
  }
  .core {
    border-color: var(--primary);
    box-shadow: 0 0 10px rgba(95, 227, 240, .35), 0 0 22px rgba(95, 227, 240, .12);
  }
  .core.thinking { animation: dl-core-pulse 1s ease-in-out infinite; }
  @keyframes dl-core-pulse {
    0%, 100% { box-shadow: 0 0 8px rgba(95, 227, 240, .3), 0 0 16px rgba(95,227,240,.1); transform: scale(1); }
    50% { box-shadow: 0 0 20px rgba(95, 227, 240, .9), 0 0 44px rgba(139,124,255,.4); transform: scale(1.14); }
  }

  .new-chat-btn {
    border-radius: var(--dl-radius);
    background: linear-gradient(135deg, rgba(95,227,240,.14), rgba(139,124,255,.10));
    border: 1px solid var(--border-strong);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.05), 0 4px 14px rgba(0,0,0,.25);
    transition: transform var(--dl-dur) var(--dl-ease), box-shadow var(--dl-dur) var(--dl-ease);
  }
  .new-chat-btn:hover {
    box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 6px 22px rgba(95,227,240,.18);
    transform: translateY(-1px);
  }

  .session-item { border-radius: var(--dl-radius); transition: background var(--dl-dur) var(--dl-ease), box-shadow var(--dl-dur) var(--dl-ease); }
  .session-item.active {
    background: linear-gradient(90deg, rgba(95,227,240,.12), transparent);
    box-shadow: inset 2px 0 0 var(--primary);
  }
  .sidebar-nav-item { border-radius: var(--dl-radius); }

  /* ── Painel principal ──────────────────────────────────────────────── */
  .topbar { backdrop-filter: blur(12px); background: rgba(5,7,9,.5); }

  /* ── Mensagens: entrada com movimento intencional ─────────────────── */
  .msg { animation: dl-fade-up .38s var(--dl-ease) both; }
  @keyframes dl-fade-up { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .msg.user {
    border-radius: var(--dl-radius) var(--dl-radius) 4px var(--dl-radius);
    background: linear-gradient(135deg, rgba(30,38,50,.9), rgba(20,26,36,.9));
    border: 1px solid var(--border);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.04);
  }

  /* ── Cards com glassmorphism (composer, itens de lista, editores) ──── */
  .composer {
    border-radius: 20px;
    background: var(--card-glass);
    backdrop-filter: blur(14px);
    border: 1px solid var(--border);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.04), 0 8px 26px rgba(0,0,0,.3);
    transition: border-color var(--dl-dur) var(--dl-ease), box-shadow var(--dl-dur) var(--dl-ease);
  }
  .composer:focus-within {
    border-color: var(--border-strong);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.04), 0 0 0 3px rgba(95,227,240,.08), 0 8px 26px rgba(0,0,0,.3);
  }
  #send {
    background: var(--brand-gradient);
    border-radius: var(--dl-radius);
    box-shadow: 0 2px 12px rgba(95,227,240,.3);
    transition: transform var(--dl-dur) var(--dl-ease), box-shadow var(--dl-dur) var(--dl-ease);
  }
  #send:not(:disabled):hover { box-shadow: 0 4px 18px rgba(95,227,240,.5); transform: translateY(-1px); }

  .cmditem, .apps-list-item, .help-item, .brain-editor-box {
    border-radius: var(--dl-radius);
    background: var(--card-glass);
    backdrop-filter: blur(10px);
    border: 1px solid var(--border);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.03), 0 6px 20px rgba(0,0,0,.22);
    transition: border-color var(--dl-dur) var(--dl-ease), transform var(--dl-dur) var(--dl-ease);
    animation: dl-fade-up .3s var(--dl-ease) both;
  }
  .cmditem:hover, .apps-list-item:hover, .help-item:hover { border-color: var(--border-strong); }

  .settings-inner input, .settings-inner select, .apps-form input {
    border-radius: var(--dl-radius);
    background: var(--card-glass);
    backdrop-filter: blur(8px);
    border: 1px solid var(--border);
    transition: border-color var(--dl-dur) var(--dl-ease), box-shadow var(--dl-dur) var(--dl-ease);
  }
  .settings-inner input:focus, .settings-inner select:focus, .apps-form input:focus {
    border-color: var(--border-strong);
    box-shadow: 0 0 0 3px rgba(95,227,240,.08);
  }
  .settings-inner button, .apps-form button {
    border-radius: var(--dl-radius);
    transition: transform var(--dl-dur) var(--dl-ease), box-shadow var(--dl-dur) var(--dl-ease);
  }
  .settings-inner button:hover, .apps-form button:hover { box-shadow: 0 4px 16px rgba(95,227,240,.2); }

  /* ── Foco acessível em tudo clicável ───────────────────────────────── */
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, [tabindex]:focus-visible {
    outline: 2px solid var(--primary);
    outline-offset: 2px;
  }

  /* ── Second Brain: glow nos nós, condizente com o resto ───────────── */
  .brain-node-circle { filter: drop-shadow(0 0 4px currentColor); }
  .brain-core-ring { stroke: var(--accent); }

  /* ── Botão de ativar a FACE, na topbar ─────────────────────────────── */
  #faceModeBtn {
    margin-left: 12px; background: linear-gradient(135deg, rgba(95,227,240,.12), rgba(139,124,255,.10));
    border: 1px solid var(--border-strong); color: var(--primary); border-radius: var(--dl-radius);
    padding: 6px 12px; font-size: 11.5px; font-weight: 700; letter-spacing: .5px; cursor: pointer;
    transition: box-shadow var(--dl-dur) var(--dl-ease), transform var(--dl-dur) var(--dl-ease);
  }
  #faceModeBtn:hover { box-shadow: 0 0 16px rgba(95,227,240,.3); transform: translateY(-1px); }

  /* ═══════════════════════════════════════════════════════════════════
     TELA FACE — cockpit em tela cheia, componente autossuficiente.
     Usa os mesmos tokens de cor/fonte da camada acima. Degrada com
     elegância: sem dados reais, mostra "—" ou uma pulsação-demo.
     ═══════════════════════════════════════════════════════════════════ */
  #faceMode {
    position: fixed; inset: 0; z-index: 999; display: none;
    background:
      radial-gradient(ellipse 1200px 800px at 50% 30%, rgba(95,227,240,.10), transparent 60%),
      radial-gradient(ellipse 900px 700px at 20% 90%, rgba(139,124,255,.08), transparent 60%),
      var(--bg);
    font-family: 'Share Tech Mono', var(--font-body), monospace;
    color: var(--txt);
    overflow: hidden;
  }
  #faceMode.on { display: block; }
  #faceGlobe { position: absolute; inset: 0; width: 100%; height: 100%; opacity: .55; }
  .face-scanlines {
    position: absolute; inset: 0; pointer-events: none; opacity: .12;
    background: repeating-linear-gradient(180deg, rgba(255,255,255,.5) 0px, transparent 1px, transparent 3px);
  }
  .face-corners span {
    position: absolute; width: 26px; height: 26px; border-color: var(--accent); opacity: .6;
  }
  .face-corners .tl { top: 18px; left: 18px; border-top: 1px solid; border-left: 1px solid; }
  .face-corners .tr { top: 18px; right: 18px; border-top: 1px solid; border-right: 1px solid; }
  .face-corners .bl { bottom: 18px; left: 18px; border-bottom: 1px solid; border-left: 1px solid; }
  .face-corners .br { bottom: 18px; right: 18px; border-bottom: 1px solid; border-right: 1px solid; }

  .face-top {
    position: absolute; top: 32px; left: 44px; right: 44px;
    display: flex; justify-content: space-between; align-items: flex-start; z-index: 2;
  }
  .face-brand {
    font-family: 'Orbitron', var(--font-display), sans-serif; font-weight: 700; font-size: 22px;
    letter-spacing: 6px; color: var(--primary);
    text-shadow: 0 0 12px rgba(95,227,240,.7), 0 0 30px rgba(95,227,240,.3);
  }
  .face-clock { text-align: right; font-family: 'Share Tech Mono', monospace; }
  #faceTime { font-size: 30px; color: var(--txt); font-variant-numeric: tabular-nums; letter-spacing: 2px; }
  #faceDate { font-size: 12px; color: var(--txt2); text-transform: uppercase; letter-spacing: 1.5px; margin-top: 2px; }

  .face-orb-wrap {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 260px; height: 260px; z-index: 2;
  }
  .face-ring {
    position: absolute; inset: 0; border-radius: 50%;
    background: conic-gradient(var(--primary), transparent 40%, var(--accent), transparent 80%, var(--primary));
    -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px));
    mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px));
    opacity: .75;
  }
  .face-ring.r1 { animation: dl-spin 9s linear infinite; }
  .face-ring.r2 { inset: 22px; animation: dl-spin-rev 15s linear infinite; opacity: .55; }
  .face-ring.r3 { inset: 44px; animation: dl-spin 24s linear infinite; opacity: .4; }
  @keyframes dl-spin { to { transform: rotate(360deg); } }
  @keyframes dl-spin-rev { to { transform: rotate(-360deg); } }

  .face-core {
    position: absolute; inset: 78px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, var(--primary), var(--accent) 70%, #04141a);
    box-shadow: 0 0 30px rgba(95,227,240,.55), 0 0 70px rgba(139,124,255,.3), inset 0 0 30px rgba(0,0,0,.3);
    animation: dl-breathe 4.5s ease-in-out infinite;
    cursor: pointer;
  }
  @keyframes dl-breathe { 0%, 100% { transform: scale(1); filter: brightness(1); } 50% { transform: scale(1.06); filter: brightness(1.18); } }

  #faceMode[data-s="listening"] .face-ring { animation-duration: 3s; }
  #faceMode[data-s="thinking"] .face-ring { animation-duration: 1.4s; }
  #faceMode[data-s="speaking"] .face-core { animation-duration: 1.6s; }

  .face-state {
    position: absolute; top: calc(50% + 150px); left: 50%; transform: translateX(-50%);
    font-family: 'Orbitron', var(--font-display), sans-serif; font-size: 13px; letter-spacing: 4px;
    color: var(--primary); text-shadow: 0 0 10px rgba(95,227,240,.6); z-index: 2;
  }
  .face-transcript {
    position: absolute; top: calc(50% + 180px); left: 50%; transform: translateX(-50%);
    max-width: 480px; text-align: center; font-size: 13px; color: var(--txt2);
    min-height: 18px; z-index: 2; padding: 0 20px;
  }

  .face-panel {
    position: absolute; top: 120px; bottom: 90px; width: 230px;
    background: var(--card-glass); backdrop-filter: blur(14px);
    border: 1px solid var(--border); border-radius: var(--dl-radius);
    padding: 16px; font-size: 11px; overflow-y: auto; z-index: 2;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.03), 0 8px 26px rgba(0,0,0,.35);
  }
  .face-panel-left { left: 40px; border-left: 2px solid var(--accent); }
  .face-panel-right { right: 40px; border-right: 2px solid var(--accent); }
  .face-panel-title {
    color: var(--txt3); text-transform: uppercase; letter-spacing: 2px; font-size: 10px;
    margin: 14px 0 8px; border-bottom: 1px solid var(--border); padding-bottom: 4px;
  }
  .face-panel-title:first-child { margin-top: 0; }
  .face-row { display: flex; justify-content: space-between; padding: 3px 0; color: var(--txt2); }
  .face-row .dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; margin-right: 6px; }
  .face-log-line { color: var(--txt3); padding: 2px 0; font-size: 10.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .face-ticker {
    position: absolute; bottom: 32px; left: 50%; transform: translateX(-50%);
    font-size: 11px; color: var(--txt2); letter-spacing: 1px; z-index: 2; white-space: nowrap;
  }
  .face-hint {
    position: absolute; bottom: 10px; right: 44px; font-size: 10px; color: var(--txt3);
    letter-spacing: .5px; z-index: 2;
  }

  @media (max-width: 780px) {
    .face-panel { display: none; } /* HUD lateral não cabe em telas pequenas — orbe + estado continuam */
    .face-top { left: 20px; right: 20px; top: 20px; }
    .face-brand { font-size: 16px; letter-spacing: 3px; }
    #faceTime { font-size: 20px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .face-ring, .face-core { animation: none !important; }
  }

  @media (max-width: 780px) {
    .sidebar { box-shadow: 20px 0 44px rgba(0,0,0,.5); }
    .apps-form { flex-direction: column; }
    .apps-form input, .apps-form button { width: 100%; }
  }

  @media (prefers-reduced-motion: reduce) {
    .msg, .cmditem, .apps-list-item, .help-item, .core.thinking { animation: none !important; }
    body::after { animation: none !important; }
  }
</style>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
</head>
<body>

<div class="app-shell">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="core" id="core"></div>
      <span class="brand-name">J.A.R.V.I.S.</span>
    </div>

    <button class="new-chat-btn" id="newChatBtn">+ Nova conversa</button>

    <div class="sidebar-label">Conversas</div>
    <div class="session-list" id="sessionList"></div>

    <div class="sidebar-footer">
      <button class="sidebar-nav-item" id="digestBtn">
        <span>🌅 Bom dia (Digest)</span>
      </button>
      <button class="sidebar-nav-item" id="agendaTabBtn">
        <span>📅 Agenda</span>
      </button>
      <button class="sidebar-nav-item" id="emailTabBtn">
        <span>📧 E-mails</span>
        <span class="badge" id="emailActionBadge"></span>
      </button>
      <button class="sidebar-nav-item" id="newsTabBtn">
        <span>📰 Notícias</span>
      </button>
      <button class="sidebar-nav-item" id="helpTabBtn">
        <span>📋 O que posso pedir</span>
      </button>
      <button class="sidebar-nav-item" id="secondBrainTabBtn">
        <span>🧠 Second Brain</span>
        <span id="brainCount"></span>
      </button>
      <button class="sidebar-nav-item" id="pendingTabBtn">
        <span>Comandos pendentes</span>
        <span class="badge" id="pendingBadge"></span>
      </button>
      <button class="sidebar-nav-item" id="ttsToggleBtn">
        <span>Resposta falada</span>
        <span id="ttsState">desligada</span>
      </button>
      <button class="sidebar-nav-item" id="settingsTabBtn">
        <span>Configurar</span>
        <span id="connState">⚠</span>
      </button>
    </div>
  </aside>

  <main class="main-area">
    <div class="topbar">
      <button id="sidebarToggle">☰</button>
      <span id="sessionTitle">Nova conversa</span>
      <span id="statusline"></span>
      <button id="faceModeBtn" title="Modo FACE (tecla F)">🛰 FACE</button>
    </div>

    <div class="panel active" data-panel="chat">
      <div class="chat-scroll" id="chatScroll">
        <div class="chat-inner" id="log"></div>
      </div>
      <div class="composer-wrap">
        <div class="attach-preview" id="attachPreview"></div>
        <div class="composer">
          <label class="icon-btn" for="fileInput" title="Anexar áudio/vídeo">📎</label>
          <input type="file" id="fileInput" accept="audio/*,video/*" hidden />
          <button class="icon-btn" id="micBtn" title="Gravar áudio">🎤</button>
          <textarea id="input" rows="1" placeholder="Fale com J.A.R.V.I.S..."></textarea>
          <button id="stopBtn" title="Parar" style="display:none">■</button>
          <button id="send" title="Enviar">➤</button>
        </div>
      </div>
    </div>

    <div class="panel" data-panel="settings">
      <div class="settings-inner">
        <h2>Configurar conexão</h2>
        <label for="apiKey">X-API-Key</label>
        <input id="apiKey" type="password" placeholder="Cole sua chave aqui" />
        <button id="saveSettingsBtn">Salvar</button>

        <h2 style="margin-top: 20px;">Microfone</h2>
        <label for="micSelect">Dispositivo de captura de áudio</label>
        <select id="micSelect"></select>
        <button id="testMicBtn" type="button">Testar microfone (3s)</button>
        <span id="micTestResult" style="font-size:12px;color:var(--text-dim);"></span>

        <h2 style="margin-top: 20px;">Saída de áudio</h2>
        <label for="speakerSelect">Onde a resposta falada toca</label>
        <select id="speakerSelect"></select>
        <button id="testSpeakerBtn" type="button">Testar saída</button>
        <span id="speakerTestResult" style="font-size:12px;color:var(--text-dim);"></span>

        <h2 style="margin-top: 20px;">Aplicativos</h2>
        <label>Programas que o JARVIS pode abrir por voz ("abre o X")</label>
        <div id="appsList" class="apps-list"></div>

        <div class="apps-form">
          <input id="newAppNome" type="text" placeholder="Nome (ex: whatsapp)" />
          <input id="newAppComando" type="text" placeholder="Comando (ex: start whatsapp:)" />
          <button id="addAppBtn" type="button">+ Adicionar</button>
        </div>
        <span id="appsFormResult" style="font-size:12px;color:var(--text-dim);"></span>

        <h2 style="margin-top: 20px;">📅 Agendas (Google)</h2>
        <label>Cole o "endereço secreto em formato iCal" de cada agenda</label>
        <div id="calendarsList" class="apps-list"></div>
        <div class="apps-form">
          <input id="newCalNome" type="text" placeholder="Nome (ex: Pessoal)" />
          <input id="newCalUrl" type="text" placeholder="Link iCal secreto" />
          <button id="addCalBtn" type="button">+ Adicionar</button>
        </div>
        <span id="calFormResult" style="font-size:12px;color:var(--text-dim);"></span>

        <h2 style="margin-top: 20px;">📧 Contas de e-mail</h2>
        <label>Usa senha de app (myaccount.google.com/apppasswords), nunca a senha normal</label>
        <div id="emailAccountsList" class="apps-list"></div>
        <div class="apps-form" style="flex-wrap: wrap;">
          <input id="newEmailApelido" type="text" placeholder="Apelido (ex: Pessoal)" style="flex-basis: 100%;" />
          <select id="newEmailHost" style="flex: 1;"></select>
          <input id="newEmailUsuario" type="text" placeholder="seuemail@gmail.com" style="flex: 1;" />
          <input id="newEmailSenha" type="password" placeholder="Senha de app (16 letras)" style="flex: 1;" />
          <button id="addEmailBtn" type="button">+ Adicionar</button>
        </div>
        <span id="emailFormResult" style="font-size:12px;color:var(--text-dim);"></span>

        <h2 style="margin-top: 20px;">📰 Assuntos de notícia</h2>
        <div id="newsTopicsList" class="apps-list"></div>
        <div class="apps-form">
          <input id="newTopicNome" type="text" placeholder="Assunto (ex: futebol)" />
          <button id="addTopicBtn" type="button">+ Adicionar</button>
        </div>
        <span id="topicFormResult" style="font-size:12px;color:var(--text-dim);"></span>
      </div>
    </div>

    <div class="panel" data-panel="commands">
      <div class="commands-inner" id="commandsInner">
        <div class="empty-state">Carregando...</div>
      </div>
    </div>

    <div class="panel" data-panel="second-brain">
      <div class="brain-toolbar">
        <div>
          <strong>🧠 Second Brain</strong>
          <span id="brainSubtitle" class="brain-subtitle"></span>
        </div>
        <button id="brainReloadBtn" class="icon-btn" title="Recarregar">⟳</button>
      </div>
      <div class="brain-graph-wrap" id="brainGraphWrap">
        <div class="empty-state">Carregando...</div>
      </div>
      <div class="brain-legend" id="brainLegend"></div>
    </div>

    <div class="panel" data-panel="help">
      <div class="help-inner" id="helpInner">
        <div class="empty-state">Carregando...</div>
      </div>
    </div>

    <div class="panel" data-panel="agenda">
      <div class="hub-toolbar">
        <strong>📅 Agenda</strong>
        <button id="agendaReloadBtn" class="icon-btn" title="Recarregar">⟳</button>
      </div>
      <div class="hub-inner" id="agendaInner">
        <div class="empty-state">Carregando...</div>
      </div>
    </div>

    <div class="panel" data-panel="email">
      <div class="hub-toolbar">
        <strong>📧 E-mails</strong>
        <button id="emailReloadBtn" class="icon-btn" title="Recarregar">⟳</button>
      </div>
      <div class="hub-tabs">
        <button class="hub-tab active" data-bucket="acao">Ação</button>
        <button class="hub-tab" data-bucket="info">Info</button>
        <button class="hub-tab" data-bucket="ruido">Ruído</button>
      </div>
      <div class="hub-inner" id="emailInner">
        <div class="empty-state">Carregando...</div>
      </div>
    </div>

    <div class="panel" data-panel="news">
      <div class="hub-toolbar">
        <strong>📰 Notícias</strong>
        <button id="newsReloadBtn" class="icon-btn" title="Recarregar">⟳</button>
      </div>
      <div class="hub-inner" id="newsInner">
        <div class="empty-state">Carregando...</div>
      </div>
    </div>
  </main>
</div>

<script>
(function () {
  const serverUrl = ""; // same-origin: /app é servido pelo próprio backend

  let apiKey = localStorage.getItem("jarvis_api_key") || "";
  let ttsEnabled = localStorage.getItem("jarvis_tts_enabled") === "true";
  let currentSessionId = localStorage.getItem("jarvis_last_session") || ("session-" + Date.now());
  let pendingFile = null;
  let mediaRecorder = null;
  let recordedChunks = [];
  let isRecording = false;
  let selectedMicId = localStorage.getItem("jarvis_mic_device_id") || "";
  let selectedSpeakerId = localStorage.getItem("jarvis_speaker_device_id") || "";

  const $ = (id) => document.getElementById(id);
  const sidebar = $("sidebar");
  const chatScroll = $("chatScroll");
  const log = $("log");
  const input = $("input");
  const sendBtn = $("send");
  const stopBtn = $("stopBtn");
  const core = $("core");
  const statusline = $("statusline");
  const sessionTitle = $("sessionTitle");
  const sessionList = $("sessionList");
  const apiKeyInput = $("apiKey");
  const connState = $("connState");
  const micSelect = $("micSelect");
  const speakerSelect = $("speakerSelect");

  function showPanel(name) {
    document.querySelectorAll(".panel").forEach((p) => p.classList.toggle("active", p.dataset.panel === name));
    if (name === "commands") loadCommands();
    if (name === "second-brain") loadSecondBrain();
    if (name === "help") loadHelp();
    if (name === "agenda") loadAgenda();
    if (name === "email") loadEmails();
    if (name === "news") loadNews();
    if (name === "settings") { loadMicDevices(); loadApps(); loadCalendarsConfig(); loadEmailAccountsConfig(); loadNewsTopicsConfig(); }
    closeSidebarOnMobile();
  }
  $("settingsTabBtn").addEventListener("click", () => showPanel("settings"));
  $("pendingTabBtn").addEventListener("click", () => showPanel("commands"));
  $("secondBrainTabBtn").addEventListener("click", () => showPanel("second-brain"));
  $("helpTabBtn").addEventListener("click", () => showPanel("help"));
  $("agendaTabBtn").addEventListener("click", () => showPanel("agenda"));
  $("emailTabBtn").addEventListener("click", () => showPanel("email"));
  $("newsTabBtn").addEventListener("click", () => showPanel("news"));
  $("digestBtn").addEventListener("click", triggerDigest);
  $("brainReloadBtn").addEventListener("click", loadSecondBrain);

  function closeSidebarOnMobile() {
    if (window.innerWidth <= 780) sidebar.classList.remove("open");
  }
  $("sidebarToggle").addEventListener("click", () => sidebar.classList.toggle("open"));

  apiKeyInput.value = apiKey;
  connState.textContent = apiKey ? "✓" : "⚠";
  if (!apiKey) showPanel("settings");

  $("saveSettingsBtn").addEventListener("click", () => {
    apiKey = apiKeyInput.value.trim();
    localStorage.setItem("jarvis_api_key", apiKey);
    connState.textContent = apiKey ? "✓" : "⚠";
    showPanel("chat");
    addLine("system", "Configurações salvas.");
    loadSessions();
  });

  // ── Seleção de microfone ─────────────────────────────────────────
  async function loadMicDevices() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) {
      micSelect.innerHTML = '<option value="">Navegador não suporta listar microfones</option>';
      speakerSelect.innerHTML = '<option value="">Navegador não suporta listar saídas</option>';
      return;
    }
    try {
      // Pede permissão primeiro — sem isso, o navegador não revela os nomes dos dispositivos
      const tempStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      tempStream.getTracks().forEach((t) => t.stop());

      const devices = await navigator.mediaDevices.enumerateDevices();
      const mics = devices.filter((d) => d.kind === "audioinput");
      const speakers = devices.filter((d) => d.kind === "audiooutput");

      micSelect.innerHTML = "";
      const defaultMicOpt = document.createElement("option");
      defaultMicOpt.value = "";
      defaultMicOpt.textContent = "Padrão do sistema";
      micSelect.appendChild(defaultMicOpt);

      mics.forEach((mic) => {
        const opt = document.createElement("option");
        opt.value = mic.deviceId;
        opt.textContent = mic.label || `Microfone ${mic.deviceId.slice(0, 8)}`;
        if (mic.deviceId === selectedMicId) opt.selected = true;
        micSelect.appendChild(opt);
      });

      if (!("setSinkId" in HTMLMediaElement.prototype)) {
        speakerSelect.innerHTML = '<option value="">Seu navegador não suporta escolher a saída (tenta Chrome/Edge)</option>';
      } else if (!speakers.length) {
        speakerSelect.innerHTML = '<option value="">Nenhuma saída detectada</option>';
      } else {
        speakerSelect.innerHTML = "";
        const defaultSpeakerOpt = document.createElement("option");
        defaultSpeakerOpt.value = "";
        defaultSpeakerOpt.textContent = "Padrão do sistema";
        speakerSelect.appendChild(defaultSpeakerOpt);

        speakers.forEach((sp) => {
          const opt = document.createElement("option");
          opt.value = sp.deviceId;
          opt.textContent = sp.label || `Saída ${sp.deviceId.slice(0, 8)}`;
          if (sp.deviceId === selectedSpeakerId) opt.selected = true;
          speakerSelect.appendChild(opt);
        });
      }
    } catch (err) {
      micSelect.innerHTML = '<option value="">Não foi possível listar — permita o microfone</option>';
      speakerSelect.innerHTML = '<option value="">Não foi possível listar</option>';
    }
  }

  micSelect.addEventListener("change", () => {
    selectedMicId = micSelect.value;
    localStorage.setItem("jarvis_mic_device_id", selectedMicId);
  });

  speakerSelect.addEventListener("change", () => {
    selectedSpeakerId = speakerSelect.value;
    localStorage.setItem("jarvis_speaker_device_id", selectedSpeakerId);
  });

  $("testSpeakerBtn").addEventListener("click", async () => {
    const resultEl = $("speakerTestResult");
    try {
      // Bipe curto sintetizado na hora (sem precisar de arquivo nem do servidor)
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const dest = audioCtx.createMediaStreamDestination();
      const osc = audioCtx.createOscillator();
      osc.frequency.value = 880;
      osc.connect(dest);

      const audioEl = new Audio();
      audioEl.srcObject = dest.stream;
      if (selectedSpeakerId && "setSinkId" in audioEl) {
        await audioEl.setSinkId(selectedSpeakerId);
      }
      await audioEl.play();
      osc.start();
      resultEl.textContent = "🔊 Tocando bipe de teste...";
      setTimeout(() => {
        osc.stop();
        audioEl.pause();
        audioCtx.close();
        resultEl.textContent = "Ouviu o bipe? Se não, tenta outra saída na lista.";
      }, 600);
    } catch (err) {
      resultEl.textContent = "Erro: " + err.message;
    }
  });

  async function runMicTest(isRetry) {
    const resultEl = $("micTestResult");
    resultEl.textContent = isRetry ? "Tentando de novo..." : "Gravando 3s, fala alguma coisa...";
    try {
      const constraints = selectedMicId ? { audio: { deviceId: { exact: selectedMicId } } } : { audio: true };
      const stream = await navigator.mediaDevices.getUserMedia(constraints);
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const analyser = audioCtx.createAnalyser();
      const source = audioCtx.createMediaStreamSource(stream);
      source.connect(analyser);
      const data = new Uint8Array(analyser.frequencyBinCount);
      let maxVolume = 0;
      const start = Date.now();
      function sample() {
        analyser.getByteFrequencyData(data);
        const avg = data.reduce((a, b) => a + b, 0) / data.length;
        maxVolume = Math.max(maxVolume, avg);
        if (Date.now() - start < 3000) {
          requestAnimationFrame(sample);
        } else {
          stream.getTracks().forEach((t) => t.stop());
          audioCtx.close();
          resultEl.textContent = maxVolume > 5
            ? `✓ Captando som (pico: ${maxVolume.toFixed(0)}) — microfone funcionando`
            : "⚠ Quase nenhum som captado — confira se é o microfone certo";
        }
      }
      sample();
    } catch (err) {
      // "Could not start audio source" é um erro bem conhecido com headsets
      // Bluetooth — o Windows precisa trocar o perfil dele (de música pra
      // chamada) quando um app pede o microfone, e às vezes essa troca
      // falha ou demora. Tenta de novo automaticamente uma vez antes de
      // desistir, já que geralmente resolve sozinho na segunda tentativa.
      const isBluetoothLikeError = err.name === "NotReadableError" || /could not start/i.test(err.message);
      if (isBluetoothLikeError && !isRetry) {
        setTimeout(() => runMicTest(true), 800);
        return;
      }
      if (isBluetoothLikeError) {
        resultEl.textContent =
          "⚠ O Windows não conseguiu acessar esse microfone (comum em headsets Bluetooth, " +
          "que precisam trocar de 'modo música' pra 'modo chamada'). Tenta: 1) desconectar e " +
          "reconectar o Bluetooth, 2) testar o microfone em outro app (ex: Gravador de Voz do " +
          "Windows) pra confirmar se funciona fora do navegador, 3) usar o microfone interno " +
          "do PC como alternativa.";
      } else {
        resultEl.textContent = "Erro: " + err.message;
      }
    }
  }
  $("testMicBtn").addEventListener("click", () => runMicTest(false));

  const ttsBtn = $("ttsToggleBtn");
  const ttsState = $("ttsState");
  function refreshTtsLabel() {
    ttsState.textContent = ttsEnabled ? "ligada" : "desligada";
    ttsBtn.classList.toggle("active-toggle", ttsEnabled);
  }
  refreshTtsLabel();
  ttsBtn.addEventListener("click", () => {
    ttsEnabled = !ttsEnabled;
    localStorage.setItem("jarvis_tts_enabled", ttsEnabled);
    refreshTtsLabel();
  });

  function escapeHtml(s) {
    const d = document.createElement("div");
    d.textContent = s;
    return d.innerHTML;
  }

  function renderMarkdown(raw) {
    let text = escapeHtml(raw);

    const codeBlocks = [];
    text = text.replace(/```([a-zA-Z0-9]*)\n?([\s\S]*?)```/g, (_, lang, code) => {
      codeBlocks.push(`<pre><code>${code.replace(/\n$/, "")}</code></pre>`);
      return `\u0000CODEBLOCK${codeBlocks.length - 1}\u0000`;
    });

    text = text.replace(/`([^`\n]+)`/g, "<code>$1</code>");
    text = text.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    text = text.replace(/(?<!\*)\*([^*\n]+)\*(?!\*)/g, "<em>$1</em>");
    text = text.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');

    const lines = text.split("\n");
    let html = "";
    let inUl = false, inOl = false, para = [];

    function flushPara() {
      if (para.length) { html += `<p>${para.join("<br>")}</p>`; para = []; }
    }
    for (const line of lines) {
      const codeBlockMatch = line.match(/^\u0000CODEBLOCK(\d+)\u0000$/);
      const ulMatch = line.match(/^\s*[-*]\s+(.*)/);
      const olMatch = line.match(/^\s*\d+\.\s+(.*)/);
      if (codeBlockMatch) {
        flushPara();
        if (inUl) { html += "</ul>"; inUl = false; }
        if (inOl) { html += "</ol>"; inOl = false; }
        html += codeBlocks[+codeBlockMatch[1]];
      } else if (ulMatch) {
        flushPara();
        if (!inUl) { html += "<ul>"; inUl = true; }
        html += `<li>${ulMatch[1]}</li>`;
      } else if (olMatch) {
        flushPara();
        if (!inOl) { html += "<ol>"; inOl = true; }
        html += `<li>${olMatch[1]}</li>`;
      } else {
        if (inUl) { html += "</ul>"; inUl = false; }
        if (inOl) { html += "</ol>"; inOl = false; }
        if (line.trim() === "") flushPara();
        else para.push(line);
      }
    }
    if (inUl) html += "</ul>";
    if (inOl) html += "</ol>";
    flushPara();

    html = html.replace(/\u0000CODEBLOCK(\d+)\u0000/g, (_, i) => codeBlocks[+i]);
    return html || "<p></p>";
  }

  function addLine(role, text) {
    const div = document.createElement("div");
    div.className = "msg " + role;
    if (role === "assistant") {
      div.innerHTML = `<div class="msg-label"><span class="dot"></span>JARVIS</div><div class="msg-body">${renderMarkdown(text)}</div>`;
    } else {
      div.textContent = text;
    }
    log.appendChild(div);
    chatScroll.scrollTop = chatScroll.scrollHeight;
    return div;
  }

  function updateAssistantBody(div, text) {
    const body = div.querySelector(".msg-body");
    if (body) body.innerHTML = renderMarkdown(text);
    chatScroll.scrollTop = chatScroll.scrollHeight;
  }

  function addToolActivity(label) {
    const div = document.createElement("div");
    div.className = "msg tool";
    div.innerHTML = `<span class="tool-dot"></span> ${escapeHtml(label)}`;
    log.appendChild(div);
    chatScroll.scrollTop = chatScroll.scrollHeight;
  }

  function addScreenshot(base64Jpeg) {
    const div = document.createElement("div");
    div.className = "msg screenshot";
    const img = document.createElement("img");
    img.src = "data:image/jpeg;base64," + base64Jpeg;
    img.alt = "Captura de tela analisada pelo JARVIS";
    img.addEventListener("click", () => window.open(img.src, "_blank"));
    div.appendChild(img);
    log.appendChild(div);
    chatScroll.scrollTop = chatScroll.scrollHeight;
  }

  function showTyping() {
    const div = document.createElement("div");
    div.className = "typing";
    div.dataset.typingIndicator = "1";
    div.innerHTML = "<span></span><span></span><span></span>";
    log.appendChild(div);
    chatScroll.scrollTop = chatScroll.scrollHeight;
  }
  function hideTyping() {
    document.querySelectorAll('[data-typing-indicator]').forEach((el) => el.remove());
  }
  function setThinking(on) {
    core.classList.toggle("thinking", on);
    statusline.textContent = on ? "processando..." : "";
  }

  async function loadSessions() {
    if (!apiKey) return;
    try {
      const res = await fetch(serverUrl + "/conversations", { headers: { "X-API-Key": apiKey } });
      if (!res.ok) return;
      const data = await res.json();
      renderSessionList(data.sessions || []);
    } catch (e) { /* silencioso */ }
  }

  function renderSessionList(sessions) {
    sessionList.innerHTML = "";
    if (!sessions.includes(currentSessionId)) sessions = [currentSessionId, ...sessions];
    sessions.forEach((sid) => {
      const item = document.createElement("div");
      item.className = "session-item" + (sid === currentSessionId ? " active" : "");
      item.textContent = sid;
      item.title = sid;
      item.addEventListener("click", () => switchSession(sid));
      sessionList.appendChild(item);
    });
  }

  async function switchSession(sid) {
    currentSessionId = sid;
    localStorage.setItem("jarvis_last_session", sid);
    sessionTitle.textContent = sid;
    log.innerHTML = "";
    renderSessionList(Array.from(sessionList.children).map((el) => el.title));
    if (!apiKey) return;
    try {
      const res = await fetch(serverUrl + `/conversations/${encodeURIComponent(sid)}`, { headers: { "X-API-Key": apiKey } });
      if (!res.ok) return;
      const data = await res.json();
      (data.messages || []).forEach((m) => {
        const text = typeof m.content === "string" ? m.content : "";
        if (text) addLine(m.role === "assistant" ? "assistant" : "user", text);
      });
      if (!data.messages || !data.messages.length) {
        addLine("assistant", "Sistemas prontos, senhor. Como posso ajudar?");
      }
    } catch (e) {
      addLine("system", "Não foi possível carregar essa conversa.");
    }
  }

  $("newChatBtn").addEventListener("click", () => {
    switchSession("session-" + Date.now());
  });

  let isSending = false;
  let currentAbortController = null;

  input.addEventListener("input", () => {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 160) + "px";
  });
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); handleSend(); }
  });
  sendBtn.addEventListener("click", handleSend);
  stopBtn.addEventListener("click", () => {
    if (currentAbortController) currentAbortController.abort();
  });

  async function handleSend() {
    if (isSending) return; // bloqueia envio duplicado (Enter repetido, ou clique + Enter juntos)
    const value = input.value.trim();
    if (!value && !pendingFile) return;
    if (!apiKey) { showPanel("settings"); return; }

    isSending = true;
    currentAbortController = new AbortController();
    input.value = "";
    input.style.height = "auto";
    const userMsgDiv = addLine("user", value || (pendingFile ? "🎤 transcrevendo áudio..." : ""));
    sendBtn.style.display = "none";
    stopBtn.style.display = "flex";
    setThinking(true);
    showTyping();

    try {
      if (pendingFile) {
        const form = new FormData();
        form.append("session_id", currentSessionId);
        form.append("message", value);
        const kind = pendingFile.type.startsWith("audio/") ? "audio" : "video";
        form.append(kind, pendingFile);
        clearAttachment();

        const res = await fetch(serverUrl + "/chat/media", {
          method: "POST", headers: { "X-API-Key": apiKey }, body: form,
          signal: currentAbortController.signal,
        });
        hideTyping();
        if (!res.ok) {
          const errBody = await res.text();
          addLine("system", "Erro do servidor: " + res.status + " " + errBody);
          return;
        }
        const data = await res.json();
        if (data.transcript) userMsgDiv.textContent = data.transcript; // troca o placeholder pelo que você disse de verdade
        addLine("assistant", data.reply || "(sem resposta)");
        speakIfEnabled(data.reply);
      } else {
        await sendStreaming(value, currentAbortController.signal);
      }
      loadSessions();
    } catch (err) {
      hideTyping();
      if (err.name === "AbortError") {
        addLine("system", "Geração interrompida.");
      } else {
        addLine("system", "Falha de conexão: " + err.message + " — confira se o servidor está rodando.");
      }
    } finally {
      isSending = false;
      currentAbortController = null;
      sendBtn.style.display = "flex";
      stopBtn.style.display = "none";
      setThinking(false);
    }
  }

  async function sendStreaming(value, signal) {
    const res = await fetch(serverUrl + "/chat/stream", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-API-Key": apiKey },
      body: JSON.stringify({ message: value, session_id: currentSessionId }),
      signal,
    });
    if (!res.ok || !res.body) {
      hideTyping();
      const errBody = await res.text().catch(() => "");
      addLine("system", "Erro do servidor: " + res.status + " " + errBody);
      return;
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    let assistantDiv = null;
    let assistantText = "";
    let sawError = false;

    while (true) {
      const { value: chunk, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(chunk, { stream: true });
      const frames = buffer.split("\n\n");
      buffer = frames.pop();

      for (const frame of frames) {
        if (frame.startsWith("event: error")) {
          sawError = true;
          const dataLine = frame.split("\n").find((l) => l.startsWith("data: "));
          hideTyping();
          addLine("system", "Erro: " + (dataLine ? dataLine.slice(6) : "desconhecido"));
          continue;
        }
        if (frame.startsWith("event: done")) continue;

        if (frame.startsWith("event: tool")) {
          const dataLine = frame.split("\n").find((l) => l.startsWith("data: "));
          if (!dataLine) continue;
          try {
            const payload = JSON.parse(dataLine.slice(6));
            hideTyping();
            addToolActivity(payload.label);
            showTyping();
          } catch { /* ignora frame malformado */ }
          continue;
        }

        if (frame.startsWith("event: screenshot")) {
          const dataLine = frame.split("\n").find((l) => l.startsWith("data: "));
          if (!dataLine) continue;
          try {
            const payload = JSON.parse(dataLine.slice(6));
            hideTyping();
            addScreenshot(payload.image);
            showTyping();
          } catch { /* ignora frame malformado */ }
          continue;
        }

        if (frame.startsWith("data: ")) {
          const raw = frame.slice(6);
          let text;
          try { text = JSON.parse(raw); } catch { continue; }
          if (!assistantDiv) { hideTyping(); assistantDiv = addLine("assistant", ""); }
          assistantText += text;
          updateAssistantBody(assistantDiv, assistantText);
        }
      }
    }
    hideTyping();
    if (!sawError) speakIfEnabled(assistantText);
  }

  $("fileInput").addEventListener("change", () => {
    const f = $("fileInput").files[0];
    pendingFile = f || null;
    const preview = $("attachPreview");
    if (pendingFile) {
      preview.classList.add("show");
      preview.innerHTML = `📎 ${escapeHtml(pendingFile.name)} <button id="clearAttachBtn">remover</button>`;
      $("clearAttachBtn").addEventListener("click", clearAttachment);
    } else {
      preview.classList.remove("show");
    }
  });
  function clearAttachment() {
    pendingFile = null;
    $("fileInput").value = "";
    const preview = $("attachPreview");
    preview.classList.remove("show");
    preview.innerHTML = "";
  }

  async function speakIfEnabled(text) {
    if (!ttsEnabled || !text || !apiKey) return;
    try {
      const res = await fetch(serverUrl + "/tts", {
        method: "POST",
        headers: { "X-API-Key": apiKey, "Content-Type": "application/x-www-form-urlencoded" },
        body: new URLSearchParams({ text }),
      });
      if (!res.ok) return;
      const blob = await res.blob();
      const url = URL.createObjectURL(blob);
      const audio = new Audio(url);
      if (selectedSpeakerId && "setSinkId" in audio) {
        try { await audio.setSinkId(selectedSpeakerId); } catch (e) { /* segue tocando na saída padrão se falhar */ }
      }
      audio.play();
      audio.onended = () => URL.revokeObjectURL(url);
    } catch (e) { /* falha silenciosa */ }
  }

  $("micBtn").addEventListener("click", toggleRecording);
  async function toggleRecording() {
    if (!apiKey) { showPanel("settings"); return; }
    if (isRecording) { mediaRecorder.stop(); return; }
    try {
      const constraints = selectedMicId ? { audio: { deviceId: { exact: selectedMicId } } } : { audio: true };
      const stream = await navigator.mediaDevices.getUserMedia(constraints);
      recordedChunks = [];
      mediaRecorder = new MediaRecorder(stream);
      mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) recordedChunks.push(e.data); };
      mediaRecorder.onstop = () => {
        stream.getTracks().forEach((t) => t.stop());
        $("micBtn").classList.remove("recording");
        isRecording = false;
        const blob = new Blob(recordedChunks, { type: "audio/webm" });
        if (blob.size > 500) {
          pendingFile = new File([blob], "gravacao.webm", { type: "audio/webm" });
          handleSend();
        }
      };
      mediaRecorder.start();
      isRecording = true;
      $("micBtn").classList.add("recording");
    } catch (err) {
      addLine("system", "Não foi possível acessar o microfone: " + err.message);
    }
  }

  // ── Gerenciar apps configurados (abrir por voz) ─────────────────────
  // ── "O que posso pedir" — lista de comandos organizados por categoria ──
  async function loadHelp() {
    const el = $("helpInner");
    let appNames = [];
    if (apiKey) {
      try {
        const res = await fetch(serverUrl + "/apps", { headers: { "X-API-Key": apiKey } });
        const data = await res.json();
        appNames = (data.apps || []).map((a) => a.nome);
      } catch (e) { /* segue com a lista genérica se falhar */ }
    }

    const exemploApp1 = appNames[0] || "Steam";
    const exemploApp2 = appNames[1] || "Discord";

    const categorias = [
      {
        titulo: "📱 Apps e programas",

    voce: { label: "Sobre você", color: "#8a90a6" },
    metas: { label: "Metas", color: "#fbbf24" },
    carreira: { label: "Carreira", color: "#ff5547" },

  };

  let brainAnimFrame = null;
  let brainPulses = [];

  async function loadSecondBrain() {
    const wrap = $("brainGraphWrap");
    if (!apiKey) { wrap.innerHTML = '<div class="empty-state">Configure sua API Key primeiro.</div>'; return; }
    try {
      const res = await fetch(serverUrl + "/memories", { headers: { "X-API-Key": apiKey } });
      const data = await res.json();
      const notes = (data.memories || []).filter((m) => BRAIN_CATEGORIES[m.category]);
