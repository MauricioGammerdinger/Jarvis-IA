<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>J.A.R.V.I.S.</title>

<link rel="manifest" href="/app/manifest.json" />
<meta name="theme-color" content="#090c11" />
<link rel="icon" href="/app/icon-192.png" />
<link rel="apple-touch-icon" href="/app/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="JARVIS" />
<meta name="mobile-web-app-capable" content="yes" />
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, system-ui, sans-serif;
    background: #090c11; color: #e6edf3; height: 100vh; display: flex; flex-direction: column;
  }
  header { padding: 14px 16px; border-bottom: 1px solid #223040; display: flex; align-items: center; gap: 10px; }
  .core { width: 20px; height: 20px; border-radius: 50%; border: 2px solid #5fe3f0; position: relative; transition: box-shadow .3s; }
  .core::before { content: ''; position: absolute; inset: 4px; border-radius: 50%; background: #5fe3f0; opacity: .7; }
  .core.thinking { animation: corePulse 1.1s ease-in-out infinite; }
  @keyframes corePulse {
    0%, 100% { box-shadow: 0 0 4px rgba(95,227,240,.3); transform: scale(1); }
    50% { box-shadow: 0 0 16px rgba(95,227,240,.8); transform: scale(1.12); }
  }
  header b { font-size: 15px; letter-spacing: 1px; }
  header .sub { font-size: 11px; color: #7c8ba0; margin-left: auto; }
  #ttsToggle { background: none; border: 1px solid #223040; border-radius: 6px; font-size: 13px; padding: 4px 8px; cursor: pointer; margin-left: auto; transition: border-color .2s; }
  #ttsToggle.on { border-color: #5fe3f0; }

  #micBtn { background: none; border: none; font-size: 20px; padding: 6px; cursor: pointer; flex-shrink: 0; transition: transform .15s; }
  #micBtn:active { transform: scale(.9); }
  #micBtn.recording { animation: micPulse 1s ease-in-out infinite; }
  @keyframes micPulse {
    0%, 100% { opacity: 1; }
    50% { opacity: .4; }
  }

  #settings { padding: 14px 16px; border-bottom: 1px solid #223040; display: none; flex-direction: column; gap: 8px; }
  #settings.open { display: flex; animation: fadeInUp .25s ease both; }
  #settings input { background: #151d29; border: 1px solid #223040; border-radius: 8px; color: #e6edf3; padding: 10px; font-size: 14px; }
  #settings button { background: #2d4a52; color: #5fe3f0; border: 1px solid #5fe3f0; border-radius: 8px; padding: 10px; font-weight: 700; font-size: 13px; transition: transform .1s, background .2s; }
  #settings button:active { transform: scale(.96); }

  #tabs { display: flex; border-bottom: 1px solid #223040; }
  #tabs button { flex: 1; background: none; border: none; color: #7c8ba0; padding: 10px; font-size: 12px; border-bottom: 2px solid transparent; transition: color .2s, border-color .2s; }
  #tabs button.active { color: #5fe3f0; border-bottom-color: #5fe3f0; }

  #chat { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  #log { flex: 1; overflow-y: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .msg { font-size: 14px; line-height: 1.6; max-width: 90%; animation: fadeInUp .28s ease both; }
  .msg.user { align-self: flex-end; background: #151d29; padding: 9px 13px; border-radius: 10px 10px 2px 10px; }
  .msg.assistant { align-self: flex-start; }
  .msg.assistant b { color: #5fe3f0; }
  .msg.system { align-self: center; color: #7c8ba0; font-size: 11px; font-style: italic; }

  /* Indicador de "digitando" — três pontos pulsando, igual apps de mensagem */
  .typing { align-self: flex-start; display: flex; gap: 4px; padding: 6px 0; animation: fadeInUp .2s ease both; }
  .typing span {
    width: 6px; height: 6px; border-radius: 50%; background: #5fe3f0; opacity: .4;
    animation: typingBounce 1.1s ease-in-out infinite;
  }
  .typing span:nth-child(2) { animation-delay: .15s; }
  .typing span:nth-child(3) { animation-delay: .3s; }
  @keyframes typingBounce {
    0%, 60%, 100% { opacity: .3; transform: translateY(0); }
    30% { opacity: 1; transform: translateY(-4px); }
  }

  #inputrow { display: flex; gap: 8px; padding: 12px 14px; border-top: 1px solid #223040; align-items: center; }
  #attachBtn { font-size: 20px; padding: 6px; cursor: pointer; flex-shrink: 0; transition: transform .15s; }
  #attachBtn:active { transform: scale(.9); }
  #attachPreview { padding: 0 14px 10px; font-size: 11px; color: #7c8ba0; display: none; }
  #attachPreview.show { display: flex; align-items: center; gap: 8px; animation: fadeInUp .2s ease both; }
  #attachPreview button { background: none; border: none; color: #e08b8b; font-size: 14px; cursor: pointer; }
  #input { flex: 1; background: #151d29; border: 1px solid #223040; border-radius: 8px; color: #e6edf3; padding: 10px 12px; font-size: 15px; transition: border-color .2s; }
  #input:focus { outline: none; border-color: #5fe3f0; }
  #send { background: #2d4a52; color: #5fe3f0; border: 1px solid #5fe3f0; border-radius: 8px; padding: 0 16px; font-weight: 700; transition: transform .1s, opacity .2s; }
  #send:active:not(:disabled) { transform: scale(.94); }
  #send:disabled { opacity: .4; }

  #commands { display: none; flex: 1; overflow-y: auto; padding: 14px 16px; }
  #commands.active { display: block; }
  .cmditem { background: #151d29; border: 1px solid #223040; border-radius: 8px; padding: 12px; margin-bottom: 10px; font-size: 13px; animation: fadeInUp .25s ease both; }
  .cmditem code { display: block; background: #090c11; padding: 6px 8px; border-radius: 6px; margin: 6px 0; font-size: 12px; word-break: break-all; }
  .cmditem .row { display: flex; gap: 8px; margin-top: 8px; }
  .cmditem button { flex: 1; border: none; border-radius: 6px; padding: 8px; font-weight: 700; font-size: 12px; transition: transform .1s; }
  .cmditem button:active { transform: scale(.95); }
  .approve { background: #1d3b2e; color: #6fe0a0; }
  .reject { background: #3b1d1d; color: #e08b8b; }

  /* Respeita quem prefere menos movimento na tela */
  @media (prefers-reduced-motion: reduce) {
    .core.thinking { animation: none; opacity: .7; }
    .msg, .typing, #settings.open, #attachPreview.show, .cmditem { animation: none; }
    .typing span { animation: none; opacity: .6; }
    #micBtn.recording { animation: none; opacity: .5; }
  }
  .empty { color: #7c8ba0; font-size: 13px; font-style: italic; padding: 20px 0; text-align: center; }
</style>
</head>
<body>

<header>
  <div class="core" id="core"></div>
  <b>J.A.R.V.I.S.</b>
  <button id="ttsToggle" title="Resposta falada" onclick="toggleTts()">🔇</button>
  <span class="sub" id="statusline" onclick="toggleSettings()">configurar ⚙</span>
</header>

<div id="settings">
  <input id="apiKey" placeholder="X-API-Key" type="password" />
  <button onclick="saveSettings()">Salvar</button>
</div>

<div id="tabs">
  <button class="active" data-tab="chat" onclick="switchTab('chat')">Conversa</button>
  <button data-tab="commands" onclick="switchTab('commands')">Pendentes</button>
</div>

<div id="chat">
  <div id="log"></div>
  <div id="inputrow">
    <label id="attachBtn" for="fileInput">📎</label>
    <input type="file" id="fileInput" accept="audio/*,video/*" style="display:none" onchange="handleFileSelect()" />
    <button id="micBtn" onclick="toggleRecording()" title="Gravar áudio">🎤</button>
    <input id="input" placeholder="Fale com J.A.R.V.I.S..." autocomplete="off" />
    <button id="send" onclick="handleSend()">Enviar</button>
  </div>
  <div id="attachPreview"></div>
</div>

<div id="commands"></div>

<script>
  // Como esta página é servida pelo próprio backend (/app), as chamadas usam
  // caminhos relativos — não precisa mais digitar a URL do servidor.
  const serverUrl = "";
  let apiKey = localStorage.getItem("jarvis_api_key") || "";

  document.getElementById("apiKey").value = apiKey;
  if (!apiKey) document.getElementById("settings").classList.add("open");
  updateStatusline();

  function updateStatusline() {
    document.getElementById("statusline").textContent = apiKey ? "conectado ⚙" : "configurar ⚙";
  }

  function toggleSettings() {
    document.getElementById("settings").classList.toggle("open");
  }

  function saveSettings() {
    apiKey = document.getElementById("apiKey").value.trim();
    localStorage.setItem("jarvis_api_key", apiKey);
    updateStatusline();
    document.getElementById("settings").classList.remove("open");
    addLine("system", "Configurações salvas.");
  }

  function switchTab(tab) {
    document.querySelectorAll("#tabs button").forEach((b) => b.classList.toggle("active", b.dataset.tab === tab));
    document.getElementById("chat").style.display = tab === "chat" ? "flex" : "none";
    document.getElementById("commands").classList.toggle("active", tab === "commands");
    if (tab === "commands") loadCommands();
  }

  function addLine(role, text) {
    const div = document.createElement("div");
    div.className = "msg " + role;
    div.innerHTML = role === "assistant" ? `<b>JARVIS </b>${escapeHtml(text)}` : escapeHtml(text);
    document.getElementById("log").appendChild(div);
    div.scrollIntoView({ block: "end" });
    return div;
  }

  function showTyping() {
    const div = document.createElement("div");
    div.className = "typing";
    div.id = "typingIndicator";
    div.innerHTML = "<span></span><span></span><span></span>";
    document.getElementById("log").appendChild(div);
    div.scrollIntoView({ block: "end" });
  }

  function hideTyping() {
    const el = document.getElementById("typingIndicator");
    if (el) el.remove();
  }

  function setThinking(on) {
    document.getElementById("core").classList.toggle("thinking", on);
  }

  function escapeHtml(s) {
    const d = document.createElement("div");
    d.textContent = s;
    return d.innerHTML;
  }

  let pendingFile = null;

  function handleFileSelect() {
    const fileInput = document.getElementById("fileInput");
    pendingFile = fileInput.files[0] || null;
    const preview = document.getElementById("attachPreview");
    if (pendingFile) {
      preview.classList.add("show");
      preview.innerHTML = `📎 ${escapeHtml(pendingFile.name)} <button onclick="clearAttachment()">remover</button>`;
    } else {
      preview.classList.remove("show");
      preview.innerHTML = "";
    }
  }

  function clearAttachment() {
    pendingFile = null;
    document.getElementById("fileInput").value = "";
    const preview = document.getElementById("attachPreview");
    preview.classList.remove("show");
    preview.innerHTML = "";
  }

  async function handleSend() {
    const input = document.getElementById("input");
    const value = input.value.trim();
    if (!value && !pendingFile) return;
    if (!apiKey) {
      addLine("system", "Configure sua API Key primeiro (ícone ⚙).");
      return;
    }
    input.value = "";
    addLine("user", value || `[enviando ${pendingFile.name}]`);
    const sendBtn = document.getElementById("send");
    sendBtn.disabled = true;
    setThinking(true);
    showTyping();

    try {
      if (pendingFile) {
        // Áudio/vídeo anexado: usa /chat/media (imagem não é suportada pelo modelo local)
        const form = new FormData();
        form.append("session_id", "mobile");
        form.append("message", value);
        const kind = pendingFile.type.startsWith("audio/") ? "audio" : "video";
        form.append(kind, pendingFile);
        clearAttachment();

        const res = await fetch(serverUrl + "/chat/media", {
          method: "POST",
          headers: { "X-API-Key": apiKey },
          body: form
        });
        hideTyping();
        if (!res.ok) {
          const errBody = await res.text();
          addLine("system", "Erro do servidor: " + res.status + " " + errBody);
          return;
        }
        const data = await res.json();
        addLine("assistant", data.reply || "(sem resposta)");
        speakIfEnabled(data.reply);
      } else {
        // Texto puro: usa streaming, o texto vai aparecendo aos poucos
        await sendStreaming(value);
      }
    } catch (err) {
      hideTyping();
      addLine("system", "Falha de conexão: " + err.message + " — confira se o servidor está rodando (e o Tailscale ativo, se acessando de fora).");
    } finally {
      sendBtn.disabled = false;
      setThinking(false);
    }
  }

  async function sendStreaming(value) {
    const res = await fetch(serverUrl + "/chat/stream", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-API-Key": apiKey },
      body: JSON.stringify({ message: value, session_id: "mobile" })
    });
    if (!res.ok || !res.body) {
      hideTyping();
      const errBody = await res.text().catch(() => "");
      addLine("system", "Erro do servidor: " + res.status + " " + errBody);
      return;
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    let assistantDiv = null;
    let assistantText = "";
    let sawError = false;

    while (true) {
      const { value: chunk, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(chunk, { stream: true });
      const frames = buffer.split("\n\n");
      buffer = frames.pop(); // guarda um frame incompleto pro próximo pedaço

      for (const frame of frames) {
        if (frame.startsWith("event: error")) {
          sawError = true;
          const dataLine = frame.split("\n").find((l) => l.startsWith("data: "));
          hideTyping();
          addLine("system", "Erro: " + (dataLine ? dataLine.slice(6) : "desconhecido"));
          continue;
        }
        if (frame.startsWith("event: done")) continue;
        if (frame.startsWith("data: ")) {
          const raw = frame.slice(6);
          let text;
          try { text = JSON.parse(raw); } catch { continue; }
          if (!assistantDiv) {
            hideTyping();
            assistantDiv = addLine("assistant", "");
          }
          assistantText += text;
          assistantDiv.innerHTML = `<b>JARVIS </b>${escapeHtml(assistantText)}`;
          assistantDiv.scrollIntoView({ block: "end" });
        }
      }
    }

    hideTyping();
    if (!sawError) speakIfEnabled(assistantText);
  }

  document.getElementById("input").addEventListener("keydown", (e) => {
    if (e.key === "Enter") handleSend();
  });

  // ── Resposta falada (TTS) ────────────────────────────────────────────
  let ttsEnabled = localStorage.getItem("jarvis_tts_enabled") === "true";
  document.getElementById("ttsToggle").textContent = ttsEnabled ? "🔊" : "🔇";
  document.getElementById("ttsToggle").classList.toggle("on", ttsEnabled);

  function toggleTts() {
    ttsEnabled = !ttsEnabled;
    localStorage.setItem("jarvis_tts_enabled", ttsEnabled);
    const btn = document.getElementById("ttsToggle");
    btn.textContent = ttsEnabled ? "🔊" : "🔇";
    btn.classList.toggle("on", ttsEnabled);
  }

  async function speakIfEnabled(text) {
    if (!ttsEnabled || !text || !apiKey) return;
    try {
      const res = await fetch(serverUrl + "/tts", {
        method: "POST",
        headers: { "X-API-Key": apiKey, "Content-Type": "application/x-www-form-urlencoded" },
        body: new URLSearchParams({ text })
      });
      if (!res.ok) return; // falha silenciosa — não travar o chat por causa do áudio
      const blob = await res.blob();
      const url = URL.createObjectURL(blob);
      const audio = new Audio(url);
      audio.play();
      audio.onended = () => URL.revokeObjectURL(url);
    } catch (err) {
      console.error("Falha ao gerar TTS:", err);
    }
  }

  // ── Gravação de áudio (microfone) ────────────────────────────────────
  let mediaRecorder = null;
  let recordedChunks = [];
  let isRecording = false;

  async function toggleRecording() {
    if (!apiKey) {
      addLine("system", "Configure sua API Key primeiro (ícone ⚙).");
      return;
    }
    if (isRecording) {
      mediaRecorder.stop();
      return;
    }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      recordedChunks = [];
      mediaRecorder = new MediaRecorder(stream);
      mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) recordedChunks.push(e.data); };
      mediaRecorder.onstop = () => {
        stream.getTracks().forEach((t) => t.stop());
        document.getElementById("micBtn").classList.remove("recording");
        isRecording = false;
        const blob = new Blob(recordedChunks, { type: "audio/webm" });
        if (blob.size > 500) {
          pendingFile = new File([blob], "gravacao.webm", { type: "audio/webm" });
          handleSend();
        }
      };
      mediaRecorder.start();
      isRecording = true;
      document.getElementById("micBtn").classList.add("recording");
    } catch (err) {
      addLine("system", "Não foi possível acessar o microfone: " + err.message);
    }
  }

  async function loadCommands() {
    const el = document.getElementById("commands");
    if (!apiKey) {
      el.innerHTML = '<div class="empty">Configure sua API Key primeiro.</div>';
      return;
    }
    el.innerHTML = '<div class="empty">Carregando...</div>';
    try {
      const res = await fetch(serverUrl + "/commands?status=pending", { headers: { "X-API-Key": apiKey } });
      const data = await res.json();
      const cmds = data.commands || [];
      if (!cmds.length) {
        el.innerHTML = '<div class="empty">Nenhum comando pendente.</div>';
        return;
      }
      el.innerHTML = "";
      cmds.forEach((c) => {
        const div = document.createElement("div");
        div.className = "cmditem";
        div.innerHTML = `
          <div>${escapeHtml(c.explicacao || "")}</div>
          <code>${escapeHtml(c.command)}</code>
          <div class="row">
            <button class="approve" onclick="resolveCommand(${c.id}, 'approve')">Aprovar</button>
            <button class="reject" onclick="resolveCommand(${c.id}, 'reject')">Rejeitar</button>
          </div>`;
        el.appendChild(div);
      });
    } catch (err) {
      el.innerHTML = '<div class="empty">Falha ao carregar: ' + escapeHtml(err.message) + "</div>";
    }
  }

  async function resolveCommand(id, action) {
    try {
      await fetch(`${serverUrl}/commands/${id}/${action}`, {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-API-Key": apiKey },
        body: action === "reject" ? JSON.stringify({ motivo: "Rejeitado pelo app mobile" }) : undefined
      });
      loadCommands();
    } catch (err) {
      alert("Falha: " + err.message);
    }
  }

  addLine("assistant", "Sistemas prontos, senhor. Configure a conexão se ainda não fez.");
</script>
</body>
</html>
