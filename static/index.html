<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>J.A.R.V.I.S.</title>

<link rel="manifest" href="/app/manifest.json" />
<meta name="theme-color" content="#090c11" />
<link rel="icon" href="/app/icon-192.png" />
<link rel="apple-touch-icon" href="/app/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="JARVIS" />
<meta name="mobile-web-app-capable" content="yes" />

<style>
  :root {
    --bg: #090c11;
    --panel: #10161f;
    --panel-2: #151d29;
    --sidebar: #0c1017;
    --line: #202a38;
    --cyan: #5fe3f0;
    --cyan-dim: #2d4a52;
    --amber: #f2a93b;
    --red: #e0665f;
    --green: #6fe0a0;
    --text: #e6edf3;
    --text-dim: #7c8ba0;
    --sidebar-width: 264px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    background: var(--bg); color: var(--text);
  }
  button { font-family: inherit; }

  .app-shell { display: flex; height: 100vh; overflow: hidden; }

  .sidebar {
    width: var(--sidebar-width); flex-shrink: 0;
    background: var(--sidebar); border-right: 1px solid var(--line);
    display: flex; flex-direction: column;
    transition: margin-left .25s ease;
  }
  .sidebar-header { display: flex; align-items: center; gap: 10px; padding: 16px 14px 12px; }
  .core { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--cyan); position: relative; flex-shrink: 0; transition: box-shadow .3s; }
  .core::before { content: ''; position: absolute; inset: 4px; border-radius: 50%; background: var(--cyan); opacity: .7; }
  .core.thinking { animation: corePulse 1.1s ease-in-out infinite; }
  @keyframes corePulse { 0%,100% { box-shadow: 0 0 4px rgba(95,227,240,.3); transform: scale(1); } 50% { box-shadow: 0 0 16px rgba(95,227,240,.8); transform: scale(1.12); } }
  .brand-name { font-weight: 700; font-size: 14px; letter-spacing: .5px; }

  .new-chat-btn {
    margin: 4px 14px 14px; padding: 10px 12px;
    background: var(--cyan-dim); color: var(--cyan); border: 1px solid var(--cyan);
    border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer;
    display: flex; align-items: center; gap: 8px; transition: background .2s, transform .1s;
  }
  .new-chat-btn:hover { background: var(--cyan); color: #061014; }
  .new-chat-btn:active { transform: scale(.97); }

  .sidebar-label { padding: 4px 18px; font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: .6px; }

  .session-list { flex: 1; overflow-y: auto; padding: 2px 8px; display: flex; flex-direction: column; gap: 2px; }
  .session-list::-webkit-scrollbar { width: 5px; }
  .session-list::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }
  .session-item {
    padding: 9px 10px; border-radius: 8px; font-size: 13px; color: var(--text-dim);
    cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    transition: background .15s, color .15s;
  }
  .session-item:hover { background: var(--panel-2); color: var(--text); }
  .session-item.active { background: var(--panel-2); color: var(--cyan); }

  .sidebar-footer { border-top: 1px solid var(--line); padding: 8px; display: flex; flex-direction: column; gap: 2px; }
  .sidebar-nav-item {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 9px 10px; border-radius: 8px; background: none; border: none;
    color: var(--text-dim); font-size: 12.5px; cursor: pointer; text-align: left; width: 100%;
    transition: background .15s, color .15s;
  }
  .sidebar-nav-item:hover { background: var(--panel-2); color: var(--text); }
  .sidebar-nav-item.active-toggle { color: var(--cyan); }
  .badge { background: var(--amber); color: #241a06; font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 10px; min-width: 16px; text-align: center; }
  .badge:empty { display: none; }

  .main-area { flex: 1; display: flex; flex-direction: column; min-width: 0; background: var(--bg); }
  .topbar {
    display: flex; align-items: center; gap: 10px; padding: 12px 20px;
    border-bottom: 1px solid var(--line); font-size: 12.5px; color: var(--text-dim);
    flex-shrink: 0;
  }
  #sidebarToggle { display: none; background: none; border: none; color: var(--text); font-size: 18px; cursor: pointer; padding: 2px 4px; }
  #sessionTitle { font-weight: 600; color: var(--text); font-size: 13px; }
  #statusline { margin-left: auto; }

  .panel { display: none; flex: 1; min-height: 0; flex-direction: column; }
  .panel.active { display: flex; }

  .chat-scroll { flex: 1; overflow-y: auto; }
  .chat-scroll::-webkit-scrollbar { width: 7px; }
  .chat-scroll::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }
  .chat-inner { max-width: 720px; margin: 0 auto; padding: 24px 24px 8px; display: flex; flex-direction: column; gap: 22px; }

  @keyframes fadeInUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

  .msg { font-size: 15px; line-height: 1.65; animation: fadeInUp .25s ease both; }
  .msg.user { align-self: flex-end; max-width: 80%; background: var(--panel-2); padding: 10px 15px; border-radius: 14px 14px 3px 14px; }
  .msg.assistant { max-width: 100%; }
  .msg.assistant .msg-label { display: flex; align-items: center; gap: 7px; color: var(--cyan); font-weight: 700; font-size: 12.5px; letter-spacing: .3px; margin-bottom: 6px; }
  .msg.assistant .msg-label .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--cyan); }
  .msg.system { align-self: center; color: var(--text-dim); font-size: 11.5px; font-style: italic; }
  .msg.tool { color: var(--amber); font-size: 12px; opacity: .85; }

  .msg-body p { margin: 0 0 10px; }
  .msg-body p:last-child { margin-bottom: 0; }
  .msg-body strong { color: #fff; font-weight: 700; }
  .msg-body em { color: var(--text); }
  .msg-body ul, .msg-body ol { margin: 4px 0 10px; padding-left: 22px; }
  .msg-body li { margin-bottom: 4px; }
  .msg-body a { color: var(--cyan); text-decoration: underline; text-underline-offset: 2px; }
  .msg-body code { background: var(--panel-2); border: 1px solid var(--line); padding: 1px 6px; border-radius: 5px; font-size: 13px; font-family: "SF Mono", "JetBrains Mono", Consolas, monospace; }
  .msg-body pre { background: #0c1119; border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; overflow-x: auto; margin: 8px 0 12px; }
  .msg-body pre code { background: none; border: none; padding: 0; font-size: 13px; line-height: 1.5; color: #d3e6ec; }

  .typing { align-self: flex-start; display: flex; gap: 4px; padding: 4px 0; }
  .typing span { width: 6px; height: 6px; border-radius: 50%; background: var(--cyan); opacity: .4; animation: typingBounce 1.1s ease-in-out infinite; }
  .typing span:nth-child(2) { animation-delay: .15s; }
  .typing span:nth-child(3) { animation-delay: .3s; }
  @keyframes typingBounce { 0%,60%,100% { opacity: .3; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-4px); } }

  .composer-wrap { max-width: 720px; margin: 0 auto; width: 100%; padding: 10px 24px 20px; flex-shrink: 0; }
  .attach-preview { display: none; align-items: center; gap: 8px; font-size: 11.5px; color: var(--text-dim); padding: 0 4px 8px; }
  .attach-preview.show { display: flex; animation: fadeInUp .2s ease both; }
  .attach-preview button { background: none; border: none; color: var(--red); cursor: pointer; font-size: 13px; }

  .composer {
    display: flex; align-items: flex-end; gap: 6px;
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 18px;
    padding: 8px 8px 8px 14px; transition: border-color .2s;
  }
  .composer:focus-within { border-color: var(--cyan); }
  .icon-btn { background: none; border: none; color: var(--text-dim); font-size: 19px; cursor: pointer; padding: 6px; border-radius: 8px; flex-shrink: 0; transition: color .15s, transform .1s; }
  .icon-btn:hover { color: var(--text); }
  .icon-btn:active { transform: scale(.9); }
  .icon-btn.recording { color: var(--red); animation: micPulse 1s ease-in-out infinite; }
  @keyframes micPulse { 0%,100% { opacity: 1; } 50% { opacity: .4; } }

  #input {
    flex: 1; background: none; border: none; color: var(--text); font-size: 15px;
    resize: none; outline: none; font-family: inherit; line-height: 1.5;
    padding: 7px 2px; max-height: 160px;
  }
  #input::placeholder { color: var(--text-dim); }

  #send {
    background: var(--cyan); color: #061014; border: none; border-radius: 12px;
    width: 34px; height: 34px; flex-shrink: 0; cursor: pointer; font-size: 15px;
    display: flex; align-items: center; justify-content: center;
    transition: opacity .2s, transform .1s;
  }
  #send:disabled { opacity: .35; cursor: not-allowed; }
  #send:not(:disabled):active { transform: scale(.92); }

  .settings-inner { max-width: 480px; margin: 40px auto; padding: 0 24px; display: flex; flex-direction: column; gap: 14px; }
  .settings-inner h2 { font-size: 18px; margin: 0 0 4px; }
  .settings-inner label { font-size: 12.5px; color: var(--text-dim); }
  .settings-inner input {
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px;
    color: var(--text); padding: 11px 13px; font-size: 14px; outline: none; transition: border-color .2s;
  }
  .settings-inner input:focus { border-color: var(--cyan); }
  .settings-inner button {
    background: var(--cyan-dim); color: var(--cyan); border: 1px solid var(--cyan);
    border-radius: 10px; padding: 11px; font-weight: 700; font-size: 13.5px; cursor: pointer;
    transition: background .2s;
  }
  .settings-inner button:hover { background: var(--cyan); color: #061014; }

  .commands-inner { max-width: 640px; margin: 0 auto; padding: 24px; width: 100%; overflow-y: auto; }
  .cmditem { background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; font-size: 13px; animation: fadeInUp .25s ease both; }
  .cmditem code { display: block; background: var(--bg); padding: 8px 10px; border-radius: 8px; margin: 8px 0; font-size: 12px; word-break: break-all; }
  .cmditem .row { display: flex; gap: 8px; margin-top: 10px; }
  .cmditem button { flex: 1; border: none; border-radius: 8px; padding: 9px; font-weight: 700; font-size: 12px; cursor: pointer; transition: transform .1s; }
  .cmditem button:active { transform: scale(.96); }
  .approve { background: #1d3b2e; color: var(--green); }
  .reject { background: #3b1d1d; color: var(--red); }
  .empty-state { color: var(--text-dim); font-size: 13px; font-style: italic; text-align: center; padding: 40px 0; }

  @media (max-width: 780px) {
    .sidebar { position: fixed; top: 0; bottom: 0; left: 0; z-index: 20; margin-left: calc(-1 * var(--sidebar-width)); box-shadow: 20px 0 40px rgba(0,0,0,.4); }
    .sidebar.open { margin-left: 0; }
    #sidebarToggle { display: block; }
    .chat-inner, .composer-wrap, .settings-inner, .commands-inner { padding-left: 16px; padding-right: 16px; }
    .msg.user { max-width: 92%; }
  }

  @media (prefers-reduced-motion: reduce) {
    .core.thinking, .typing span, .icon-btn.recording { animation: none; }
    .msg, .attach-preview.show, .cmditem { animation: none; }
  }
</style>
</head>
<body>

<div class="app-shell">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="core" id="core"></div>
      <span class="brand-name">J.A.R.V.I.S.</span>
    </div>

    <button class="new-chat-btn" id="newChatBtn">+ Nova conversa</button>

    <div class="sidebar-label">Conversas</div>
    <div class="session-list" id="sessionList"></div>

    <div class="sidebar-footer">
      <button class="sidebar-nav-item" id="pendingTabBtn">
        <span>Comandos pendentes</span>
        <span class="badge" id="pendingBadge"></span>
      </button>
      <button class="sidebar-nav-item" id="ttsToggleBtn">
        <span>Resposta falada</span>
        <span id="ttsState">desligada</span>
      </button>
      <button class="sidebar-nav-item" id="settingsTabBtn">
        <span>Configurar</span>
        <span id="connState">⚠</span>
      </button>
    </div>
  </aside>

  <main class="main-area">
    <div class="topbar">
      <button id="sidebarToggle">☰</button>
      <span id="sessionTitle">Nova conversa</span>
      <span id="statusline"></span>
    </div>

    <div class="panel active" data-panel="chat">
      <div class="chat-scroll" id="chatScroll">
        <div class="chat-inner" id="log"></div>
      </div>
      <div class="composer-wrap">
        <div class="attach-preview" id="attachPreview"></div>
        <div class="composer">
          <label class="icon-btn" for="fileInput" title="Anexar áudio/vídeo">📎</label>
          <input type="file" id="fileInput" accept="audio/*,video/*" hidden />
          <button class="icon-btn" id="micBtn" title="Gravar áudio">🎤</button>
          <textarea id="input" rows="1" placeholder="Fale com J.A.R.V.I.S..."></textarea>
          <button id="send" title="Enviar">➤</button>
        </div>
      </div>
    </div>

    <div class="panel" data-panel="settings">
      <div class="settings-inner">
        <h2>Configurar conexão</h2>
        <label for="apiKey">X-API-Key</label>
        <input id="apiKey" type="password" placeholder="Cole sua chave aqui" />
        <button id="saveSettingsBtn">Salvar</button>
      </div>
    </div>

    <div class="panel" data-panel="commands">
      <div class="commands-inner" id="commandsInner">
        <div class="empty-state">Carregando...</div>
      </div>
    </div>
  </main>
</div>

<script>
(function () {
  const serverUrl = ""; // same-origin: /app é servido pelo próprio backend

  let apiKey = localStorage.getItem("jarvis_api_key") || "";
  let ttsEnabled = localStorage.getItem("jarvis_tts_enabled") === "true";
  let currentSessionId = localStorage.getItem("jarvis_last_session") || ("session-" + Date.now());
  let pendingFile = null;
  let mediaRecorder = null;
  let recordedChunks = [];
  let isRecording = false;

  const $ = (id) => document.getElementById(id);
  const sidebar = $("sidebar");
  const chatScroll = $("chatScroll");
  const log = $("log");
  const input = $("input");
  const sendBtn = $("send");
  const core = $("core");
  const statusline = $("statusline");
  const sessionTitle = $("sessionTitle");
  const sessionList = $("sessionList");
  const apiKeyInput = $("apiKey");
  const connState = $("connState");

  function showPanel(name) {
    document.querySelectorAll(".panel").forEach((p) => p.classList.toggle("active", p.dataset.panel === name));
    if (name === "commands") loadCommands();
    closeSidebarOnMobile();
  }
  $("settingsTabBtn").addEventListener("click", () => showPanel("settings"));
  $("pendingTabBtn").addEventListener("click", () => showPanel("commands"));

  function closeSidebarOnMobile() {
    if (window.innerWidth <= 780) sidebar.classList.remove("open");
  }
  $("sidebarToggle").addEventListener("click", () => sidebar.classList.toggle("open"));

  apiKeyInput.value = apiKey;
  connState.textContent = apiKey ? "✓" : "⚠";
  if (!apiKey) showPanel("settings");

  $("saveSettingsBtn").addEventListener("click", () => {
    apiKey = apiKeyInput.value.trim();
    localStorage.setItem("jarvis_api_key", apiKey);
    connState.textContent = apiKey ? "✓" : "⚠";
    showPanel("chat");
    addLine("system", "Configurações salvas.");
    loadSessions();
  });

  const ttsBtn = $("ttsToggleBtn");
  const ttsState = $("ttsState");
  function refreshTtsLabel() {
    ttsState.textContent = ttsEnabled ? "ligada" : "desligada";
    ttsBtn.classList.toggle("active-toggle", ttsEnabled);
  }
  refreshTtsLabel();
  ttsBtn.addEventListener("click", () => {
    ttsEnabled = !ttsEnabled;
    localStorage.setItem("jarvis_tts_enabled", ttsEnabled);
    refreshTtsLabel();
  });

  function escapeHtml(s) {
    const d = document.createElement("div");
    d.textContent = s;
    return d.innerHTML;
  }

  function renderMarkdown(raw) {
    let text = escapeHtml(raw);

    const codeBlocks = [];
    text = text.replace(/```([a-zA-Z0-9]*)\n?([\s\S]*?)```/g, (_, lang, code) => {
      codeBlocks.push(`<pre><code>${code.replace(/\n$/, "")}</code></pre>`);
      return `\u0000CODEBLOCK${codeBlocks.length - 1}\u0000`;
    });

    text = text.replace(/`([^`\n]+)`/g, "<code>$1</code>");
    text = text.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    text = text.replace(/(?<!\*)\*([^*\n]+)\*(?!\*)/g, "<em>$1</em>");
    text = text.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');

    const lines = text.split("\n");
    let html = "";
    let inUl = false, inOl = false, para = [];

    function flushPara() {
      if (para.length) { html += `<p>${para.join("<br>")}</p>`; para = []; }
    }
    for (const line of lines) {
      const codeBlockMatch = line.match(/^\u0000CODEBLOCK(\d+)\u0000$/);
      const ulMatch = line.match(/^\s*[-*]\s+(.*)/);
      const olMatch = line.match(/^\s*\d+\.\s+(.*)/);
      if (codeBlockMatch) {
        flushPara();
        if (inUl) { html += "</ul>"; inUl = false; }
        if (inOl) { html += "</ol>"; inOl = false; }
        html += codeBlocks[+codeBlockMatch[1]];
      } else if (ulMatch) {
        flushPara();
        if (!inUl) { html += "<ul>"; inUl = true; }
        html += `<li>${ulMatch[1]}</li>`;
      } else if (olMatch) {
        flushPara();
        if (!inOl) { html += "<ol>"; inOl = true; }
        html += `<li>${olMatch[1]}</li>`;
      } else {
        if (inUl) { html += "</ul>"; inUl = false; }
        if (inOl) { html += "</ol>"; inOl = false; }
        if (line.trim() === "") flushPara();
        else para.push(line);
      }
    }
    if (inUl) html += "</ul>";
    if (inOl) html += "</ol>";
    flushPara();

    html = html.replace(/\u0000CODEBLOCK(\d+)\u0000/g, (_, i) => codeBlocks[+i]);
    return html || "<p></p>";
  }

  function addLine(role, text) {
    const div = document.createElement("div");
    div.className = "msg " + role;
    if (role === "assistant") {
      div.innerHTML = `<div class="msg-label"><span class="dot"></span>JARVIS</div><div class="msg-body">${renderMarkdown(text)}</div>`;
    } else {
      div.textContent = text;
    }
    log.appendChild(div);
    chatScroll.scrollTop = chatScroll.scrollHeight;
    return div;
  }

  function updateAssistantBody(div, text) {
    const body = div.querySelector(".msg-body");
    if (body) body.innerHTML = renderMarkdown(text);
    chatScroll.scrollTop = chatScroll.scrollHeight;
  }

  function showTyping() {
    const div = document.createElement("div");
    div.className = "typing";
    div.id = "typingIndicator";
    div.innerHTML = "<span></span><span></span><span></span>";
    log.appendChild(div);
    chatScroll.scrollTop = chatScroll.scrollHeight;
  }
  function hideTyping() {
    const el = $("typingIndicator");
    if (el) el.remove();
  }
  function setThinking(on) {
    core.classList.toggle("thinking", on);
    statusline.textContent = on ? "processando..." : "";
  }

  async function loadSessions() {
    if (!apiKey) return;
    try {
      const res = await fetch(serverUrl + "/conversations", { headers: { "X-API-Key": apiKey } });
      if (!res.ok) return;
      const data = await res.json();
      renderSessionList(data.sessions || []);
    } catch (e) { /* silencioso */ }
  }

  function renderSessionList(sessions) {
    sessionList.innerHTML = "";
    if (!sessions.includes(currentSessionId)) sessions = [currentSessionId, ...sessions];
    sessions.forEach((sid) => {
      const item = document.createElement("div");
      item.className = "session-item" + (sid === currentSessionId ? " active" : "");
      item.textContent = sid;
      item.title = sid;
      item.addEventListener("click", () => switchSession(sid));
      sessionList.appendChild(item);
    });
  }

  async function switchSession(sid) {
    currentSessionId = sid;
    localStorage.setItem("jarvis_last_session", sid);
    sessionTitle.textContent = sid;
    log.innerHTML = "";
    renderSessionList(Array.from(sessionList.children).map((el) => el.title));
    if (!apiKey) return;
    try {
      const res = await fetch(serverUrl + `/conversations/${encodeURIComponent(sid)}`, { headers: { "X-API-Key": apiKey } });
      if (!res.ok) return;
      const data = await res.json();
      (data.messages || []).forEach((m) => {
        const text = typeof m.content === "string" ? m.content : "";
        if (text) addLine(m.role === "assistant" ? "assistant" : "user", text);
      });
      if (!data.messages || !data.messages.length) {
        addLine("assistant", "Sistemas prontos, senhor. Como posso ajudar?");
      }
    } catch (e) {
      addLine("system", "Não foi possível carregar essa conversa.");
    }
  }

  $("newChatBtn").addEventListener("click", () => {
    switchSession("session-" + Date.now());
  });

  input.addEventListener("input", () => {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 160) + "px";
  });
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); handleSend(); }
  });
  sendBtn.addEventListener("click", handleSend);

  async function handleSend() {
    const value = input.value.trim();
    if (!value && !pendingFile) return;
    if (!apiKey) { showPanel("settings"); return; }

    input.value = "";
    input.style.height = "auto";
    addLine("user", value || `[enviando ${pendingFile.name}]`);
    sendBtn.disabled = true;
    setThinking(true);
    showTyping();

    try {
      if (pendingFile) {
        const form = new FormData();
        form.append("session_id", currentSessionId);
        form.append("message", value);
        const kind = pendingFile.type.startsWith("audio/") ? "audio" : "video";
        form.append(kind, pendingFile);
        clearAttachment();

        const res = await fetch(serverUrl + "/chat/media", { method: "POST", headers: { "X-API-Key": apiKey }, body: form });
        hideTyping();
        if (!res.ok) {
          const errBody = await res.text();
          addLine("system", "Erro do servidor: " + res.status + " " + errBody);
          return;
        }
        const data = await res.json();
        addLine("assistant", data.reply || "(sem resposta)");
        speakIfEnabled(data.reply);
      } else {
        await sendStreaming(value);
      }
      loadSessions();
    } catch (err) {
      hideTyping();
      addLine("system", "Falha de conexão: " + err.message + " — confira se o servidor está rodando.");
    } finally {
      sendBtn.disabled = false;
      setThinking(false);
    }
  }

  async function sendStreaming(value) {
    const res = await fetch(serverUrl + "/chat/stream", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-API-Key": apiKey },
      body: JSON.stringify({ message: value, session_id: currentSessionId }),
    });
    if (!res.ok || !res.body) {
      hideTyping();
      const errBody = await res.text().catch(() => "");
      addLine("system", "Erro do servidor: " + res.status + " " + errBody);
      return;
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    let assistantDiv = null;
    let assistantText = "";
    let sawError = false;

    while (true) {
      const { value: chunk, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(chunk, { stream: true });
      const frames = buffer.split("\n\n");
      buffer = frames.pop();

      for (const frame of frames) {
        if (frame.startsWith("event: error")) {
          sawError = true;
          const dataLine = frame.split("\n").find((l) => l.startsWith("data: "));
          hideTyping();
          addLine("system", "Erro: " + (dataLine ? dataLine.slice(6) : "desconhecido"));
          continue;
        }
        if (frame.startsWith("event: done")) continue;
        if (frame.startsWith("data: ")) {
          const raw = frame.slice(6);
          let text;
          try { text = JSON.parse(raw); } catch { continue; }
          if (!assistantDiv) { hideTyping(); assistantDiv = addLine("assistant", ""); }
          assistantText += text;
          updateAssistantBody(assistantDiv, assistantText);
        }
      }
    }
    hideTyping();
    if (!sawError) speakIfEnabled(assistantText);
  }

  $("fileInput").addEventListener("change", () => {
    const f = $("fileInput").files[0];
    pendingFile = f || null;
    const preview = $("attachPreview");
    if (pendingFile) {
      preview.classList.add("show");
      preview.innerHTML = `📎 ${escapeHtml(pendingFile.name)} <button id="clearAttachBtn">remover</button>`;
      $("clearAttachBtn").addEventListener("click", clearAttachment);
    } else {
      preview.classList.remove("show");
    }
  });
  function clearAttachment() {
    pendingFile = null;
    $("fileInput").value = "";
    const preview = $("attachPreview");
    preview.classList.remove("show");
    preview.innerHTML = "";
  }

  async function speakIfEnabled(text) {
    if (!ttsEnabled || !text || !apiKey) return;
    try {
      const res = await fetch(serverUrl + "/tts", {
        method: "POST",
        headers: { "X-API-Key": apiKey, "Content-Type": "application/x-www-form-urlencoded" },
        body: new URLSearchParams({ text }),
      });
      if (!res.ok) return;
      const blob = await res.blob();
      const url = URL.createObjectURL(blob);
      const audio = new Audio(url);
      audio.play();
      audio.onended = () => URL.revokeObjectURL(url);
    } catch (e) { /* falha silenciosa */ }
  }

  $("micBtn").addEventListener("click", toggleRecording);
  async function toggleRecording() {
    if (!apiKey) { showPanel("settings"); return; }
    if (isRecording) { mediaRecorder.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      recordedChunks = [];
      mediaRecorder = new MediaRecorder(stream);
      mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) recordedChunks.push(e.data); };
      mediaRecorder.onstop = () => {
        stream.getTracks().forEach((t) => t.stop());
        $("micBtn").classList.remove("recording");
        isRecording = false;
        const blob = new Blob(recordedChunks, { type: "audio/webm" });
        if (blob.size > 500) {
          pendingFile = new File([blob], "gravacao.webm", { type: "audio/webm" });
          handleSend();
        }
      };
      mediaRecorder.start();
      isRecording = true;
      $("micBtn").classList.add("recording");
    } catch (err) {
      addLine("system", "Não foi possível acessar o microfone: " + err.message);
    }
  }

  async function loadCommands() {
    const el = $("commandsInner");
    if (!apiKey) { el.innerHTML = '<div class="empty-state">Configure sua API Key primeiro.</div>'; return; }
    el.innerHTML = '<div class="empty-state">Carregando...</div>';
    try {
      const res = await fetch(serverUrl + "/commands?status=pending", { headers: { "X-API-Key": apiKey } });
      const data = await res.json();
      const cmds = data.commands || [];
      $("pendingBadge").textContent = cmds.length || "";
      if (!cmds.length) { el.innerHTML = '<div class="empty-state">Nenhum comando pendente.</div>'; return; }
      el.innerHTML = "";
      cmds.forEach((c) => {
        const div = document.createElement("div");
        div.className = "cmditem";
        div.innerHTML = `
          <div>${escapeHtml(c.explicacao || "")}</div>
          <code>${escapeHtml(c.command)}</code>
          <div class="row">
            <button class="approve">Aprovar</button>
            <button class="reject">Rejeitar</button>
          </div>`;
        div.querySelector(".approve").addEventListener("click", () => resolveCommand(c.id, "approve"));
        div.querySelector(".reject").addEventListener("click", () => resolveCommand(c.id, "reject"));
        el.appendChild(div);
      });
    } catch (err) {
      el.innerHTML = '<div class="empty-state">Falha ao carregar: ' + escapeHtml(err.message) + "</div>";
    }
  }

  async function resolveCommand(id, action) {
    try {
      await fetch(`${serverUrl}/commands/${id}/${action}`, {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-API-Key": apiKey },
        body: action === "reject" ? JSON.stringify({ motivo: "Rejeitado pelo app" }) : undefined,
      });
      loadCommands();
    } catch (err) {
      alert("Falha: " + err.message);
    }
  }

  async function init() {
    sessionTitle.textContent = "Conversa atual";
    if (apiKey) {
      await loadSessions();
      await switchSession(currentSessionId);
      loadCommands();
    } else {
      addLine("assistant", "Sistemas prontos, senhor. Configure a conexão se ainda não fez.");
    }
  }
  init();
})();
</script>
</body>
